function resolveAllianceNegotiation(id){const ep=ensureElectionPolitics(),a=ep.alliances.find(x=>x.id===id);if(!a)return;const topic=$('allianceNegotiation')?.value||'platform',tone=$('allianceTone')?.value||'compromise';if(!canAct()){toast('Eylem hakkın kalmadı.');return}if(S.stats.money<500){toast('Görüşme için 500 ₺ gerekiyor.');return}spend(1,'allianceTalk');S.stats.money-=500;const compatibility=topic==='platform'?3:topic==='autonomy'?4:topic==='cabinet'?-1:2;const roll=Math.random()+((a.trust||50)-50)/200+(tone==='transparent'?.08:tone==='firm'?-.07:.03);const success=roll>.38;const delta=success?rand(5,10)+compatibility: -rand(4,9)+(tone==='firm'?-2:0);a.trust=clamp((a.trust||50)+delta,0,100);a.stability=clamp((a.stability||50)+delta*.8,0,100);if(success){if(topic==='platform')a.platform='Ortak program üzerinde uzlaşıldı';if(topic==='autonomy')a.terms='Yerel teşkilat özerkliği garantisi';if(topic==='cabinet')a.terms='Ortak kabine ve görev paylaşımı sözü';if(topic==='candidate')a.pledges=(a.pledges||[]).concat('Ortak adaya bağlılık teyidi');log('İttifak müzakeresi başarılı',`${a.name}: ${topic==='platform'?'ortak program':topic==='autonomy'?'örgütsel özerklik':topic==='cabinet'?'görev paylaşımı':'aday bağlılığı'} konusunda uzlaşma sağlandı. Güven +${delta}.`,'success')}else{log('İttifak müzakeresi gerildi',`${a.name} görüşmesinde uzlaşma sağlanamadı. Güven ${delta} puan değişti; ittifakın dağılma riski arttı.`,'warning')}ep.negotiations.unshift({month:S.month,alliance:a.id,topic,success,delta});ep.history.unshift({month:S.month,type:'negotiation',text:`${a.name} müzakeresi: ${success?'uzlaşma sağlandı':'gerilim yaşandı'} (${topic}).`});ep.history=ep.history.slice(0,30);closeModal();save();render()}
function simulateElectionPoliticsMonth(){
 const ep=ensureElectionPolitics();
 // İttifaklar kendiliğinden de görüşme yapar; yalnızca oyuncunun kurduğu ittifaklara bağlı değildir.
 ep.alliances.slice().forEach(a=>{
  a.monthsTogether=(a.monthsTogether||0)+1;
  const stress=(a.stability<40?7:a.stability<60?4:1)+(a.trust<35?5:0);
  if(Math.random()<.22){a.trust=clamp((a.trust||50)+rand(-4,3),0,100);a.stability=clamp((a.stability||50)+rand(-3,2),0,100)}
  if(a.trust<18||a.stability<16||(a.monthsTogether>2&&Math.random()<stress/100)){
   ep.alliances=ep.alliances.filter(x=>x.id!==a.id);a.broken=true;
   ep.history.unshift({month:S.month,type:'breakup',text:`${a.name}, güven ve program anlaşmazlıkları nedeniyle dağıldı.`});
   a.parties.forEach(pid=>{const pp=S.parties.find(x=>x.id===pid);if(pp)pp.support=clamp(pp.support-rand(0,1),0,100)});
   log('İttifak dağıldı',`${a.name}, taraflar arasındaki güven ve program anlaşmazlıkları nedeniyle dağıldı. Partiler yeniden bağımsız hareket edebilir.`,'warning');
  }
 });
 // NPC adaylık kararları: Her parti aday çıkarmak zorunda değildir. Güç, örgüt ve seçim yakınlığı olasılığı etkiler.
 ep.npcElectionAI=ep.npcElectionAI||{lastCandidateMonth:-99,lastAllianceMonth:-99,lastCampaignMonth:-99,lastWithdrawalMonth:-99};
 const ai=ep.npcElectionAI;
 const nonPlayerParties=S.parties.filter(pp=>pp.id!=='OTHER'&&!pp.isPlayerParty);
 const hasCandidate=id=>!!ep.declaredCandidates[id]||ep.alliances.some(a=>a.parties.includes(id));
 const electionDistance=(()=>{const next=S.nextElectionMonth;return Number.isFinite(next)?next-S.month:18})();
 const candidatePool=nonPlayerParties.filter(pp=>!hasCandidate(pp.id)&&Number(pp.support||pp.base||0)>=2.2).map(pp=>{
  const support=Number(pp.support||pp.base||0),org=Number(pp.organization||0),c=ep.campaigns[pp.id]||{};
  const leadership=pp.leader?7:0, campaignReadiness=(Number(c.organization)||org||10)*.10+(Number(c.momentum)||0)*.12-(Number(c.fatigue)||0)*.08;
  const ambition=Number(pp.ambition)||50, viability=support*.72+org*.035+leadership+campaignReadiness+ambition*.045;
  const unwilling= support<4?12:support<7?5:0;
  return {pp,score:viability-unwilling+rand(-5,5)};
 }).sort((a,b)=>b.score-a.score);
 const candidateWindow=electionDistance<=2?1:electionDistance<=5?2:electionDistance<=9?3:5;
 if(S.month-ai.lastCandidateMonth>=candidateWindow&&candidatePool.length){
  const top=candidatePool[0],runner=candidatePool[1];
  const readiness=top.score-(runner?.score||0)*.22;
  const willingness=clamp(.10+(electionDistance<=8?.16:0)+(electionDistance<=3?.18:0)+(top.score>25?.12:0)-(top.pp.support<4?.12:0),.04,.62);
  if(Math.random()<willingness){
   const pp=top.pp,leader=pp.leader||pp.name;
   ep.declaredCandidates[pp.id]=leader;ep.campaigns[pp.id]=ep.campaigns[pp.id]||{momentum:0,organization:Math.max(10,Number(pp.organization)||10),debate:0,pledges:[],fatigue:0};
   ai.lastCandidateMonth=S.month;
   ep.history.unshift({month:S.month,type:'npc-candidate',text:`${pp.short||pp.name}, ${leader} ismini aday olarak açıkladı. Parti desteği, örgüt kapasitesi, liderlik ve seçim takvimi adaylık kararını etkiledi.`});
   log('NPC adaylığını açıkladı',`${pp.short||pp.name}, ${leader} ismini aday olarak duyurdu. Karar parti desteği, örgüt kapasitesi ve seçim takvimiyle ilişkilendirildi.`,'event');
  }
 }
 // NPC partiler ortak aday arayışına girer; ideolojik ve örgütsel yakınlık ile destek farkı dikkate alınır.
 const activeCandidateParties=Object.keys(ep.declaredCandidates).filter(id=>!ep.alliances.some(a=>a.parties.includes(id)));
 if(S.month-ai.lastAllianceMonth>=3&&activeCandidateParties.length>=3&&Math.random()<clamp(.10+(electionDistance<=8?.18:0),.06,.42)){
  const pairPool=[];
  for(let i=0;i<activeCandidateParties.length;i++)for(let j=i+1;j<activeCandidateParties.length;j++){
   const p1=S.parties.find(x=>x.id===activeCandidateParties[i]),p2=S.parties.find(x=>x.id===activeCandidateParties[j]);if(!p1||!p2)continue;
   const s1=Number(p1.support||p1.base||0),s2=Number(p2.support||p2.base||0),supportGap=Math.abs(s1-s2);
   const ide1=String(p1.ideology||'').toLocaleLowerCase('tr-TR'),ide2=String(p2.ideology||'').toLocaleLowerCase('tr-TR');
   const sameIdeology=!!ide1&&!!ide2&&(ide1===ide2||ide1.includes(ide2)||ide2.includes(ide1));
   const campaign1=ep.campaigns[p1.id]||{},campaign2=ep.campaigns[p2.id]||{};
   const viability=Math.min(24,(s1+s2)*.32)+Math.min(8,((campaign1.organization||0)+(campaign2.organization||0))*.04);
   const compatibility=sameIdeology?16:Math.max(-8,9-supportGap*.9);
   const fatiguePenalty=((campaign1.fatigue||0)+(campaign2.fatigue||0))*.035;
   const score=compatibility+viability-fatiguePenalty+rand(-4,4);
   if(score>13)pairPool.push({p1,p2,score,supportGap});
  }
  if(pairPool.length){pairPool.sort((a,b)=>b.score-a.score);const {p1,p2}=pairPool[0];const c1=ep.campaigns[p1.id]||{},c2=ep.campaigns[p2.id]||{};const viability1=Number(p1.support||p1.base||0)+(c1.momentum||0)*.12+(c1.organization||0)*.04;const viability2=Number(p2.support||p2.base||0)+(c2.momentum||0)*.12+(c2.organization||0)*.04;const candidateParty=viability1>=viability2?p1:p2;
   const trust=clamp(46+pairPool[0].score*.48,35,82),stability=clamp(38+pairPool[0].score*.48,28,84);
   const alliance={id:'npc_alliance_'+S.month+'_'+p1.id+'_'+p2.id,name:`${p1.short||p1.name} – ${p2.short||p2.name} İş Birliği`,parties:[p1.id,p2.id],candidateParty:candidateParty.id,candidateName:ep.declaredCandidates[candidateParty.id],month:S.month,trust,stability,platform:'Ekonomi ve sosyal refah',terms:'Seçim iş birliği; partiler bağımsız kalır',monthsTogether:0,pledges:['NPC partileri ortak aday ve seçim koordinasyonu üzerinde anlaştı'],campaignMomentum:0,broken:false,autonomous:true};
   ep.alliances.push(alliance);ai.lastAllianceMonth=S.month;
   ep.history.unshift({month:S.month,type:'npc-alliance',text:`${alliance.name} kuruldu. ${alliance.candidateName} ortak aday olarak destekleniyor; parti kimlikleri ve milletvekili oyları ayrı kalıyor.`});
   log('NPC partileri ittifak kurdu',`${alliance.name}, ${alliance.candidateName} üzerinde uzlaştı. Bu oyun içi siyasi simülasyondur.`,'event');
  }
 }
 // NPC kampanyaları her ay oyuncunun kaynaklarını tüketmeden gelişir; etkileri seçim tahminine eklenir.
 const activeCandidates=Object.entries(ep.declaredCandidates).filter(([id])=>!ep.alliances.some(a=>a.parties.includes(id))&&id!=='PLAYER'&&id!==(S.character.party||'__none__'));
 // Her ay birden fazla NPC kampanyası ilerler; zayıf/yorgun adaylar daha çok saha çalışması, güçlü adaylar tartışma ve program tercih eder.
 if(activeCandidates.length&&S.month-ai.lastCampaignMonth>=1){
  const count=Math.min(activeCandidates.length,electionDistance<=4?3:2);
  const ranked=activeCandidates.map(([id,name])=>{const c=ep.campaigns[id]||{};const pp=S.parties.find(x=>x.id===id);return {id,name,c,pp,priority:(Number(pp?.support||pp?.base||0)<6?5:0)+(Number(c.organization||0)<30?4:0)+(Number(c.momentum||0)<20?3:0)-(Number(c.fatigue||0)*.04)+rand(0,2)}}).sort((a,b)=>b.priority-a.priority).slice(0,count);
  const labels={field:'saha çalışması yaptı',debate:'canlı yayın tartışmasına hazırlandı',manifesto:'politika programı açıkladı',rally:'miting düzenledi'};
  ranked.forEach(({id,name,c,pp})=>{
   const action=(Number(c.fatigue||0)>65||Number(c.organization||0)<25)?pick(['field','field','manifesto']):(Number(c.momentum||0)>60?pick(['debate','manifesto','rally']):pick(['field','field','debate','manifesto','rally']));
   if(action==='field'){c.organization=clamp((c.organization||10)+rand(3,7),0,100);c.momentum=clamp((c.momentum||0)+rand(2,5),0,100);c.fatigue=clamp((c.fatigue||0)+2,0,100)}
   if(action==='debate'){c.debate=clamp((c.debate||0)+rand(3,7),0,100);c.momentum=clamp((c.momentum||0)+rand(2,4),0,100);c.fatigue=clamp((c.fatigue||0)+3,0,100)}
   if(action==='manifesto'){c.pledges=c.pledges||[];if(!c.pledges.some(x=>x.month===S.month))c.pledges.push({month:S.month,message:pick(['Ekonomi ve hayat pahalılığı','Hukuk ve şeffaflık','İstihdam ve üretim','Eğitim ve sağlık'])});c.momentum=clamp((c.momentum||0)+rand(2,5),0,100);c.organization=clamp((c.organization||10)+1,0,100)}
   if(action==='rally'){c.momentum=clamp((c.momentum||0)+rand(4,8),0,100);c.organization=clamp((c.organization||10)+rand(1,3),0,100);c.fatigue=clamp((c.fatigue||0)+rand(6,10),0,100)}
   ep.history.unshift({month:S.month,type:'npc-campaign',text:`${name} (${pp?.short||id}) ${labels[action]}. Kampanya ivmesi ${Math.round(c.momentum||0)}/100, örgütlenme ${Math.round(c.organization||0)}/100, yorgunluk ${Math.round(c.fatigue||0)}/100.`});
   log('NPC seçim kampanyası',`${name} (${pp?.short||id}) ${labels[action]}. Kampanya ivmesi, örgütlenme ve yorgunluk seçim tahminine yansıyacak.`,'event');
  });
  ai.lastCampaignMonth=S.month;
 }
 // Zayıf ve yorgun kampanyalarda aday geri çekilmesi nadiren gündeme gelir; otomatik ve zorunlu değildir.
 const weak=Object.entries(ep.declaredCandidates).filter(([id])=>!ep.alliances.some(a=>a.parties.includes(id))).map(([id,name])=>({id,name,c:ep.campaigns[id]||{momentum:0,fatigue:0},p:S.parties.find(x=>x.id===id)})).filter(x=>Number(x.p?.support||x.p?.base||0)<3&&Number(x.c.fatigue||0)>72&&Number(x.c.momentum||0)<8);
 if(S.month-ai.lastWithdrawalMonth>=4&&weak.length&&Math.random()<.06){const w=pick(weak);delete ep.declaredCandidates[w.id];ai.lastWithdrawalMonth=S.month;ep.history.unshift({month:S.month,type:'npc-withdrawal',text:`${w.name}, zayıf kampanya ivmesi ve sınırlı örgütsel destek nedeniyle adaylıktan çekildi.`});log('NPC adaylıktan çekildi',`${w.name}, sınırlı destek ve kampanya yorgunluğu nedeniyle adaylığını geri çekti. Bu otomatik karar nadirdir.`,'warning')}
 Object.entries(ep.campaigns).forEach(([id,c])=>{c.fatigue=clamp((c.fatigue||0)-rand(2,5),0,100);if(c.fatigue>65)c.momentum=clamp((c.momentum||0)-rand(1,3),0,100);else if(c.organization>40)c.momentum=clamp((c.momentum||0)+.5,0,100)});
 ep.history=ep.history.slice(0,30);
}
function withdrawPresidentialCandidate(id){const ep=ensureElectionPolitics();if(!ep.declaredCandidates[id]||!playerControlsCandidate(id,ep.declaredCandidates[id])){toast('Başka bir adayın adaylığını geri çekemezsin.');return;}if(!confirm(`${partyNameForElection(id)} adayını geri çeksin mi?`))return;delete ep.declaredCandidates[id];log('Cumhurbaşkanı adayı geri çekildi',`${partyNameForElection(id)} yarışta aday göstermemeyi seçti.`,'event');save();render()}
function buildElectionForecast(kind){
 const base=S.parties.map(p=>({id:p.id,name:p.short||p.name,color:p.color,vote:Math.max(.2,(Number(p.support)||0)+rand(-18,18)/10),seats:0}));
 if(kind==='general'){const total=base.reduce((a,b)=>a+b.vote,0)||1;base.forEach(r=>r.vote=r.vote/total*100);let left=600;base.forEach(r=>{r.seats=Math.floor(r.vote*6);left-=r.seats});base.sort((a,b)=>(b.vote*6-Math.floor(b.vote*6))-(a.vote*6-Math.floor(a.vote*6)));for(let i=0;i<left;i++)base[i%base.length].seats++;base.sort((a,b)=>b.vote-a.vote)}
 else{base.forEach(r=>r.vote=Math.max(.1,r.vote+rand(-10,10)));const total=base.reduce((a,b)=>a+b.vote,0)||1;base.forEach(r=>r.vote=r.vote/total*100);base.sort((a,b)=>b.vote-a.vote)}
 const provinceWinners={};electionProvinces().forEach(prov=>{let best=null,score=-Infinity;S.parties.forEach(p=>{const regional=(S.regionalInfluence&&S.regionalInfluence[prov])||0;const v=(p.support||0)+rand(-18,18)+(p.id===S.character.party?regional*.12:0);if(v>score){score=v;best=p}});provinceWinners[prov]={id:best.id,name:best.short||best.name,color:partyColor(best.short||best.name)}});
 const presidentialCandidates=kind==='general'?buildPresidentialCandidates():[];
 return {month:S.month,kind,winner:base[0].name,share:base[0].vote,results:base,provinceWinners,presidentialCandidates,presidentialWinner:presidentialCandidates.slice().sort((a,b)=>b.vote-a.vote)[0]?.name||null,automatic:false};
}
function stableElectionRoll(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
function currentBroadcastResults(live){
 const final=live.forecast.results,progress=clamp(live.progress/100,0,1),supportTotal=S.parties.reduce((n,p)=>n+Math.max(.2,Number(p.support)||0),0)||1;
 // At low count, the sample is deliberately less stable; as more boxes report, estimates converge to the final simulated result.
 let rows=final.map(r=>{const p=S.parties.find(x=>x.id===r.id);const baseline=Math.max(.2,Number(p?.support)||0)/supportTotal*100;const jitter=(stableElectionRoll(`${live.month}-${r.id}-partial`)-.5)*30*(1-progress);const regionalSwing=(stableElectionRoll(`${live.month}-${r.id}-regions`)-.5)*14*(1-progress);return {...r,vote:Math.max(.05,baseline*(1-progress)+r.vote*progress+jitter+regionalSwing),seats:0}});
 const sum=rows.reduce((n,r)=>n+r.vote,0)||1;rows.forEach(r=>r.vote=r.vote/sum*100);
 if(live.kind==='general'){
  // Provisional seat projection: uncertainty shrinks as the count advances. At 100%, use the forecast's final seat allocation.
  if(progress>=1){rows.forEach(r=>{const f=final.find(x=>x.id===r.id);r.seats=f?.seats||0})}
  else {
   const uncertainty=(1-progress)*24;let raw=rows.map(r=>{const swing=(stableElectionRoll(`${live.month}-${r.id}-seat-swing`)-.5)*2*uncertainty;return {...r,rawSeats:Math.max(0,r.vote*6+swing)}});
   const rawSum=raw.reduce((n,r)=>n+r.rawSeats,0)||1;raw.forEach(r=>r.rawSeats=r.rawSeats/rawSum*600);let left=600;raw.forEach(r=>{r.seats=Math.floor(r.rawSeats);left-=r.seats});raw.sort((a,b)=>(b.rawSeats-Math.floor(b.rawSeats))-(a.rawSeats-Math.floor(a.rawSeats)));for(let i=0;i<left;i++)raw[i%raw.length].seats++;rows=raw;
  }
 }
 rows.sort((a,b)=>b.vote-a.vote);
 let presidentialCandidates=[];
 if(live.kind==='general'&&Array.isArray(live.forecast.presidentialCandidates)){
  const finalCandidates=live.forecast.presidentialCandidates;presidentialCandidates=finalCandidates.map(c=>{const jitter=(stableElectionRoll(`${live.month}-${c.name}-pres-partial`)-.5)*24*(1-progress);return {...c,vote:Math.max(.1,c.vote*(progress)+(c.vote+jitter)*(1-progress))}});const totalC=presidentialCandidates.reduce((n,c)=>n+c.vote,0)||1;presidentialCandidates.forEach(c=>c.vote=c.vote/totalC*100);presidentialCandidates.sort((a,b)=>b.vote-a.vote);
  if(progress>=1)presidentialCandidates=finalCandidates.map(c=>({...c}));
 }
 // Province colors update as different simulated reporting batches arrive; each province has a stable final winner.
 const provinceWinners={};Object.entries(live.forecast.provinceWinners).forEach(([prov,finalWinner])=>{
  const reporting=stableElectionRoll(`${live.month}-${prov}-reporting`)<progress;
  if(progress>=1||reporting){provinceWinners[prov]=finalWinner;return}
  let best=null,score=-Infinity;S.parties.forEach(p=>{const base=Math.max(.2,Number(p.support)||0);const early=(stableElectionRoll(`${live.month}-${prov}-${p.id}-early`)-.5)*Math.max(18,46*(1-progress));const regional=((S.regionalInfluence&&S.regionalInfluence[prov])||0)*(p.id===S.character.party?0.12:0);const v=base+early+regional;if(v>score){score=v;best=p}});provinceWinners[prov]={id:best.id,name:best.short||best.name,color:best.color};
 });
 return {month:live.month,kind:live.kind,winner:rows[0]?.name||'—',share:rows[0]?.vote||0,results:rows,provinceWinners,presidentialCandidates,presidentialWinner:presidentialCandidates[0]?.name||null,automatic:live.automatic};
}
function startElectionBroadcast(kind,automatic=false){
 if(S.liveElection&&S.liveElection.month===S.month&&!S.liveElection.done){toast('Seçim gecesi yayını zaten devam ediyor.');return}
 S.liveElection={month:S.month,kind,automatic,progress:0,done:false,forecast:buildElectionForecast(kind),reported:0};
 log('Canlı seçim yayını başladı',`${kind==='general'?'Genel seçim':'Yerel seçim'} gecesi başladı. Sandıklar açılıyor; sonuçlar sandık oranı arttıkça güncellenecek.`,'event');
 save();render();startElectionBroadcastLoop();
}
function startElectionBroadcastLoop(){if(electionBroadcastTimer)clearInterval(electionBroadcastTimer);if(!S?.liveElection||S.liveElection.done)return;electionBroadcastTimer=setInterval(()=>{if(!S||!S.liveElection||S.liveElection.done){clearInterval(electionBroadcastTimer);electionBroadcastTimer=null;return}const l=S.liveElection;l.progress=Math.min(100,l.progress+rand(4,9));l.reported=l.progress;if(l.progress>=100){l.done=true;makeElectionResults(l.kind,l.automatic,l.forecast);log('Canlı yayın tamamlandı','Sandıkların tamamına yakını sayıldı ve nihai sonuçlar açıklandı.','success');clearInterval(electionBroadcastTimer);electionBroadcastTimer=null;}save();if(S.tab==='election')render();},1100)}

function openMeet(){const list=S.actors.slice().sort((a,b)=>(S.relationships[b.id]?.trust||0)-(S.relationships[a.id]?.trust||0));openModal('Kiminle görüşmek istiyorsun?',`<p class="muted">Görüşmeler gerçekçi erişim koşullarına bağlıdır. Üst düzey siyasetçilerle görüşmek için makam, görünürlük, güven veya güçlü parti içi konum gerekir.</p><div class="list">${list.map(a=>{const allowed=canMeetActor(a);return `<div class="list-row"><div class="person"><div class="avatar">${esc(initials(a.name))}</div><div><strong>${esc(a.name)}</strong><small>${esc(a.role)} · ${allowed?'Erişim mümkün':'Erişim yok: önce siyasi konumunu güçlendir'}</small></div></div><button class="quiet" ${allowed?'':'disabled'} onclick="closeModal();meetActor('${a.id}')">${allowed?'Görüş':'Kilitli'}</button></div>`}).join('')}</div>`)}function meetActor(id){if(S.actions<1){toast('Eylem hakkın kalmadı.');return}const a=S.actors.find(x=>x.id===id);if(!a)return;if(!canMeetActor(a)){toast('Bu siyasetçiyle görüşmek için yeterli siyasi konumun veya erişimin yok.');return}if(actionUsed('meet')){toast('Bu ay bir görüşme yaptın. Yeni görüşmeler için sonraki ayı bekle.');return}spend(1,'meet');const r=S.relationships[id];const ideologyMatch=(S.character.ideology&&a.party&&party(a.party).ideology.toLocaleLowerCase('tr-TR').includes(S.character.ideology.split(' ')[0].toLocaleLowerCase('tr-TR')))?4:0;const score=rand(-4,7)+trait('negotiation')/2+ideologyMatch;const change=score>3?rand(3,7):score<0?-rand(1,3):rand(0,2);r.trust=clamp(r.trust+change,0,100);r.respect=clamp(r.respect+Math.max(0,Math.round(score/2)),0,100);r.interest=clamp(r.interest+rand(0,3),0,100);r.notes.push({month:S.month,text:score>3?'Olumlu görüşme':'Temkinli görüşme'});statDelta('experience',2);log('Görüşme: '+a.name,score>3?`${a.name} ile verimli bir görüşme yaptın. Güven düzeyi ${change>0?'arttı':'değişmedi'}.`:`Görüşme temkinli geçti. İlişkiyi geliştirmek için daha fazla ortak zemin gerekiyor.`);checkMissions();save();render()}
function partyDetail(id){const p=party(id);const own=S.character.party===id;const body=`<div class="person"><div class="avatar" style="width:48px;height:48px;background:${p.color}22;color:${p.color}">${esc(p.short.slice(0,2))}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.ideology)}</small></div></div><div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:14px"><div class="stat"><div class="label">Simüle destek</div><div class="value">${p.support.toFixed(1)}%</div></div><div class="stat"><div class="label">Örgüt gücü</div><div class="value">${p.organization}</div></div><div class="stat"><div class="label">Üyelik</div><div class="value">${own?'Üye':'—'}</div></div></div><p class="muted tiny">Bu veriler oyunun simülasyon başlangıç değerleridir, güncel anket verisi değildir.</p>`;openModal('Parti bilgisi',body,`${own?'':`<button class="primary" onclick="closeModal();joinSpecific('${id}')">Üyelik başvurusu</button>`}<button onclick="closeModal()">Kapat</button>`)}function joinSpecific(id){if(S.character.party){toast('Önce mevcut partinden ayrılmalısın.');return}if(S.actions<1){toast('Eylem hakkın kalmadı.');return}spend();S.character.party=id;S.character.rank='Parti gönüllüsü';S.character.careerLevel=1;S.character.joinedMonth=S.month;S.stats.partySupport=clamp(S.stats.partySupport+4,0,100);S.stats.experience+=2;log('Parti üyeliği',`${party(id).name} üyeliğine katıldın.`);checkMissions();save();render()}

function promotionRequirements(target){const req=CAREER_REQS[target]||{};const checks=[['Deneyim',S.stats.experience,req.experience||0],['Örgüt desteği',S.stats.partySupport,req.partySupport||0],['Güvenilirlik',S.stats.credibility,req.credibility||0],['Görünürlük',S.stats.visibility,req.visibility||0],['Partide geçirilen süre (ay)',careerMonths(),req.months||0],['Başvuru bütçesi (₺)',S.stats.money,req.money||0]];return {req,checks,ok:checks.every(x=>x[1]>=x[2])}}
function openPromotion(){if(!S.character.party){toast('Önce bir partiye katılmalısın.');return}if(S.actions<1){toast('Eylem hakkın kalmadı.');return}const current=S.character.careerLevel;let target=nextCareerTarget();if(current>=5&&current<=6){openModal('Adaylık ve seçim yolu',`<p>Bu aşama normal terfi başvurusuyla geçilemez. Aday adayı olmak için önce parti içi adaylık sürecini başlatmalı; seçilmiş temsilci olmak için seçimde gerçekten aday olup kazanmalısın.</p><div class="notice">Adaylık ve seçilme ayrı mekaniklerdir. Genel seçim ekranındaki ülke sonucu tek başına seni milletvekili yapmaz.</div>`,`<button onclick="closeModal()">Kapat</button><button class="primary" onclick="closeModal();showTab('election')">Seçim ekranına git</button>`);return}if(current>=8){openModal('Liderlik ve hükümet yolu',`<p>Parti liderliği ve hükümet görevi basit bir terfi başvurusu değildir. Kurultay/delege yarışı, seçim sonuçları ve Meclis çoğunluğu gibi ayrı mekanikler gerekir.</p><div class="notice">Bu sürümde bu makamlar otomatik başvuruyla verilmiyor; sonraki siyasi süreçler üzerinden açılacak.</div>`,`<button class="primary" onclick="closeModal()">Anladım</button>`);return}target=Math.min(target,8);const {req,checks,ok}=promotionRequirements(target);const name=CAREER_LEVELS[target]?.name||'Yeni görev';const rows=checks.map(([label,value,need])=>`<div class="list-row"><span>${label}: <strong>${Math.floor(value)}</strong> / ${need}</span><span class="pill ${value>=need?'good':'bad'}">${value>=need?'Yeterli':'Eksik'}</span></div>`).join('');openModal(`${name} başvurusu`,`<p>${req.desc||'Bir sonraki görev için başvuru yapabilirsin.'}</p><p><strong>Hedef görev:</strong> ${name}</p><div class="list">${rows}</div><div class="notice">Başvuru bir eylem hakkı harcar. Koşulların hepsini sağlamak kabul garantisi değildir; parti örgütünün gücü ve liderlik özelliğin de etkiler.</div>`,`<button onclick="closeModal()">Vazgeç</button><button class="primary" onclick="submitPromotion(${target})" ${ok function submitPromotion(target){closeModal();if(S.actions<1){toast('Eylem hakkın kalmadı.');return}const current=S.character.careerLevel;if(target!==nextCareerTarget()||target===6||target===9){toast('Bu kariyer basamağı ayrı bir seçim veya liderlik süreci gerektirir.');return}const {req,ok}=promotionRequirements(target);if(!ok){toast('Gerekli koşullar henüz sağlanmıyor.');return}if(S.stats.money<(req.money||0)){toast('Başvuru bütçen yetersiz.');return}spend();S.stats.money-=req.money||0;const partyObj=party(S.character.party);const org=(partyObj?.organization||40)/100;const base=target===2?.28:target===3?.20:target===4?.14:target===5?.12:target===7?.08:.05;const chance=clamp(base+(S.stats.experience-(req.experience||0))*.002+(S.stats.partySupport-(req.partySupport||0))*.003+(S.stats.credibility-(req.credibility||0))*.002+trait('leadership')*.025+org*.08,0.05,0.55);if(Math.random()<chance){S.character.careerLevel=target;S.character.rank=CAREER_LEVELS[target].name;S.stats.partySupport=clamp(S.stats.partySupport+2,0,100);S.stats.experience=clamp(S.stats.experience+2,0,100);log('Görev başvurusu kabul edildi',`Parti içi değerlendirme sonucunda ${S.character.rank} görevine seçildin. Bu görev daha yüksek sorumluluk ve beklentiler getiriyor.`,'success');toast('Başvurun kabul edildi!')}else{S.stats.trust=clamp(S.stats.trust-1,0,100);S.stats.partySupport=clamp(S.stats.partySupport-1,0,100);log('Görev başvurusu reddedildi',` ${S.character.rank} olarak başvurun değerlendirildi ancak yeterli destek oluşmadı. Birkaç ay daha çalışıp ilişkilerini güçlendirmelisin.`,'warning');toast('Başvurun reddedildi.')}save();render()}
function electionKindAtMonth(month){if(month>=60&&(month-60)%60===0)return 'general';if(month>=72&&(month-72)%60===0)return 'local';return null;}
function makeElectionResults(kind,automatic=false,precomputed=null){
 const existing=S.lastElection;
 if(existing&&existing.month===S.month&&existing.kind===kind)return existing;
 const base=precomputed?JSON.parse(JSON.stringify(precomputed.results)):S.parties.map(p=>({id:p.id,name:p.short||p.name,color:p.color,vote:Math.max(.2,(Number(p.support)||0)+rand(-18,18)/10),seats:0}));
 if(!precomputed){if(kind==='general'){const total=base.reduce((a,b)=>a+b.vote,0)||1;base.forEach(r=>r.vote=r.vote/total*100);let left=600;base.forEach(r=>{r.seats=Math.floor(r.vote*6);left-=r.seats});base.sort((a,b)=>(b.vote*6-Math.floor(b.vote*6))-(a.vote*6-Math.floor(a.vote*6)));for(let i=0;i<left;i++)base[i%base.length].seats++;base.sort((a,b)=>b.vote-a.vote)}else{base.forEach(r=>r.vote=Math.max(.1,r.vote+rand(-10,10)));const total=base.reduce((a,b)=>a+b.vote,0)||1;base.forEach(r=>r.vote=r.vote/total*100);base.sort((a,b)=>b.vote-a.vote)}}
 const provinceWinners=precomputed?JSON.parse(JSON.stringify(precomputed.provinceWinners)):{};
 if(!precomputed)electionProvinces().forEach(prov=>{let best=null,score=-Infinity;S.parties.forEach(p=>{const regional=(S.regionalInfluence&&S.regionalInfluence[prov])||0;const v=(p.support||0)+rand(-18,18)+(p.id===S.character.party?regional*.12:0);if(v>score){score=v;best=p}});provinceWinners[prov]={id:best.id,name:best.short||best.name,color:partyColor(best.short||best.name)}});
 base.sort((a,b)=>b.vote-a.vote);const winner=base[0];
 const presidentialCandidates=precomputed?.presidentialCandidates?JSON.parse(JSON.stringify(precomputed.presidentialCandidates)):(kind==='general'?buildPresidentialCandidates():[]);

 if(kind==='general'&&S.political?.candidacy?.kind==='president'&&['primary','candidate','signatures'].includes(S.political.candidacy.stage)&&S.currentPresident!==S.character.name){S.stats.trust=clamp(S.stats.trust-3,0,100);S.stats.partySupport=clamp(S.stats.partySupport-2,0,100);log('Cumhurbaşkanlığı adaylık sonucu',`${S.character.name} cumhurbaşkanlığı yarışını kazanamadı. Canlı yayındaki aday oyları nihai sonuç olarak kaydedildi.`,'warning');S.political.candidacy=null;if(S.electionPolitics)S.electionPolitics.playerCandidate=null;}
