:root{--bg:#0b1020;--panel:#141c30;--panel2:#1a2540;--line:#2b3855;--text:#eef3ff;--muted:#9caecc;--gold:#e8bc67;--green:#65d6a2;--red:#f17e87;--blue:#83b5ff;--purple:#c1a0ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182748 0,#0b1020 55%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#263657;color:var(--text);padding:10px 13px;transition:.15s}button:hover{filter:brightness(1.15);transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,#bd8a38,#e9bd69);border:0;color:#151522;font-weight:800}.danger{background:#4a2537;border-color:#744052}.quiet{background:#19243b}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.sigil{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#e7bd6c,#97652c);color:#141829;font-size:24px;font-weight:900}.brand h1{font-size:21px;margin:0;letter-spacing:.3px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:16px}.side,.panel,.stat,.event,.card{background:linear-gradient(160deg,rgba(25,36,60,.98),rgba(16,24,42,.98));border:1px solid var(--line);border-radius:16px}.side{padding:12px;height:max-content;position:sticky;top:12px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted);display:flex;justify-content:space-between}.nav button.active{background:#263554;color:var(--text);border-color:#3b5078}.nav small{color:var(--gold)}.side-foot{border-top:1px solid var(--line);margin-top olor:var(--green);border-color:#315d50}.pill.warn{color:var(--gold);border-color:#6b5532}.pill.bad{color:var(--red);border-color:#744052}.feed{display:flex;flex-direction:column;gap:9px}.feed-item{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#111b30}.feed-item h4{margin:0 0 3px;font-size:13px}.feed-item p{margin:0;color:#bac7df;font-size:12px}.feed-item .date{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.list{display:flex;flex-direction:column;gap:8px}.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #26324c}.list-row:last-child{border-bottom:0}.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#2b3b5c;font-weight:800;color:#f2d69b;flex-shrink:0}.person{display:flex;align-items:center;gap:10px;min-width:0}.person strong{display:block;font-size:13px}.person small{display:block;color:var(--muted);font-size:11px}.metric{font-weight:800;font-variant-numeric:tabular-nums}.empty{padding:24px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:8px 11px;font-size:12px}.tabs button.active{border-color:var(--gold);color:var(--gold)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#0e1729;color:var(--text);padding:10px}.field textarea{min-height:80px;resize:vertical}.field.full{grid-column:1/-1}.choice{border:1px solid var(--line);border-radius:12px;padding:12px;background:#111b30;display:flex;gap:10px;align-items:flex-start}.choice input{margin-top:4px;accent-color:#e8bc67}.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:3px}.toast{position:fixed;right:18px;bottom:18px;background:#273a5a;border:1px solid #4b6289;padding:12px 16px;border-radius:12px;box-shadow:0 10px 40px #0008;z-index:20;max-width:340px}.modalback{position:fixed;inset:0;background:#050914d9;display:grid;place-items:center;padding:16px;z-index:30}.modal{max-width:680px;width:100%;max-height:90vh;overflow:auto;background:#151f35;border:1px solid #415477;border-radius:18px;padding:22px}.modal h2{margin:0 0 8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:11px 13px;border-left:3px solid var(--gold);background:#262b36;border-radius:0 8px 8px 0;color:#d7deed;font-size:12px}.tagline{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px}.big-number{font-size:28px;font-weight:900}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:600}.footer{text-align:center;color:#61718f;font-size:11px;padding:16px}.hidden{display:none!important}
@media(max-width:950px){.layout{grid-template-columns:1fr}.side{position:static}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.nav button{font-size:12px;padding:8px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:10px}.top{align-items:flex-start}.brand h1{font-size:17px}.top-actions button{padding:8px;font-size:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .value{font-size:19px}.action-list,.formgrid{grid-template-columns:1fr}.hero h2{font-size:21px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:13px}}
.choice input:disabled{cursor:not-allowed}.choice:has(input:disabled){opacity:.48;cursor:not-allowed}

.real-map-wrap{width:100%;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(ellipse at center,#1c2941,#0d1526);padding:8px}.real-province-map{display:block;width:100%;min-width:540px;height:auto;max-height:650px}.province-shape{cursor:pointer;transition:filter .12s,stroke-width .12s;vector-effect:non-scaling-stroke;outline:none}.province-shape:hover,.province-shape:focus{filter:brightness(1.25);stroke:#fff;stroke-width:2.4}.province-shape.selected{filter:brightness(1.18)}
.map-legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.map-legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 8px}
.map-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.map-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.map-summary .stat{padding:10px}
@media(max-width:700px){.map-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.real-province-map{min-width:480px}}


.parliament-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#1d2a4a,#0c1428);padding:8px}
.parliament-svg{display:block;width:100%;min-width:760px;height:auto}
.parliament-seat{cursor:pointer;stroke:#111827;stroke-width:1.5;transition:filter .12s,stroke-width .12s}
.parliament-seat:hover,.parliament-seat:focus{filter:brightness(1.4);stroke:#fff;stroke-width:2.4;outline:none}
.parliament-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}
.parliament-legend-item{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#101a2e;border-radius:9px;padding:7px;font-size:11px;min-width:0}
.parliament-legend-item i{width:11px;height:11px;border-radius:50%;flex-shrink:0}
@media(max-width:700px){.parliament-legend{grid-template-columns:repeat(2,minmax(0,1fr))}}

et pool=eligible.length?eligible:EVENTS;const contextual=pool.filter(ev=>(e.inflation>40&&/econom|budget|cost|poll|crisis/i.test(ev.id+' '+ev.type+' '+ev.title))||(S.character.party&&/party|congress|group|coalition|parliament|committee|mutlak|resignation/i.test(ev.id+' '+ev.type+' '+ev.title))||(!S.character.party&&/first|local|education|media|party_offer|disaster/i.test(ev.id+' '+ev.type+' '+ev.title)));const storyEvent=EVENTS.find(ev=>ev.storyTurn&&ev.storyTurn<=S.turn&&!S.flags['story_'+ev.id]);const e1=storyEvent||pick(contextual.length?contextual:pool);if(storyEvent)S.flags['story_'+storyEvent.id]=true;S.flags['event_'+e1.id+'_'+S.month]=true;log('Gündem: '+e1.title,e1.text,'event');S.eventQueue.push(e1.id);S.eventQueue=S.eventQueue.slice(-5)}log('Yeni ay: '+dateLabel(),`Yeni ay başladı. Ekonomi ve siyasi dengeler güncellendi. Bu ay ${S.actions} eylem hakkın var.`);save();render();if(S.liveElection&&!S.liveElection.done)startElectionBroadcastLoop();if(S.eventQueue.length){const id=S.eventQueue.shift();const ev=EVENTS.find(e=>e.id===id);if(ev)openEvent(ev)}}
function updatePolls(){const own=S.character.party;for(const p of S.parties){let delta=rand(-3,3)/10;if(p.id==='AKP')delta+=(S.economy.inflation>40?-0.15:0.05);if(p.id==='CHP')delta+=(S.economy.inflation>40?0.15:-0.03);p.support=clamp(p.support+delta,0.5,60)}if(own){const p=party(own);p.support=clamp(p.support+(S.stats.trust-50)/150+rand(-2,2)/10,0.5,60)}}
function simulateActors(){

 const ns=S.npcState;ns.goals=ns.goals||{};ns.history=ns.history||{};ns.lastMoves=ns.lastMoves||{};ns.rivalries=ns.rivalries||{};ns.coalitions=ns.coalitions||[];
 const all=(S.actors||[]).filter(a=>a.name);if(!all.length)return;
 const moves=[
  {id:'media',label:'televizyon programında açıklama yaptı',goal:'Medya görünürlüğünü artırmak',vis:3,trust:0},

  {id:'alliance',label:'başka aktörle ittifak görüşmesi yaptı',goal:'Koalisyon veya ittifak kurmak',vis:0,trust:1},

 ];
 // Her tur aktörlerin bir bölümü hareket eder; yüksek görünürlük ve makam sahibi aktörlerin hareket etme olasılığı artar.
 const movers=all.filter(a=>Math.random()<Math.min(.78,.22+(a.visibility||25)/180+(a.role&&/başkan|bakan|milletvekili|genel başkan/i.test(a.role)?.16:0))).slice(0,7);
 movers.forEach(a=>{

  const hist=ns.history[a.id]||[];let pool=moves.filter(m=>m.goal===goal);if(!pool.length)pool=moves;

  const last=ns.lastMoves[a.id];let options=pool.filter(m=>!last||m.id!==last.move);if(S.economy.mood<32&&a.style==='Sert')options=moves.filter(m=>['criticism','media','congress'].includes(m.id)&&(!last||m.id!==last.move));else if(S.economy.mood<32&&a.style==='Uzlaşmacı')options=moves.filter(m=>['alliance','policy','field'].includes(m.id)&&(!last||m.id!==last.move));if(!options.length)options=moves.filter(m=>!last||m.id!==last.move);if(!options.length)options=moves;
  if(goal==='Koalisyon veya ittifak kurmak'&&ns.coalitions.length>3)options=options.filter(m=>m.id!=='alliance').concat(moves.filter(m=>m.id==='field'));
  const m=pick(options);ns.lastMoves[a.id]={month:S.month,move:m.id,label:m.label,goal};ns.history[a.id]=[{month:S.month,move:m.id,label:m.label,goal},...hist].slice(0,12);
  a.visibility=clamp((a.visibility||25)+m.vis,0,100);

  const rel=S.relationships&&S.relationships[a.id];if(rel){rel.trust=clamp((rel.trust||40)+rand(-1,2)+m.trust,0,100);rel.respect=clamp((rel.respect||35)+rand(-1,2)+(m.id==='policy'?1:0),0,100);rel.notes=rel.notes||[];rel.notes.unshift(`${monthLabel(S.month)}: ${m.label}`);rel.notes=rel.notes.slice(0,6)}
  // Rakipler kendi aralarında da gerilim veya işbirliği geliştirir.
  if(m.id==='criticism'){const rival=pick(all.filter(x=>x.id!==a.id&&x.party!==a.party));if(rival){const key=[a.id,rival.id].sort().join('|');ns.rivalries[key]=clamp((ns.rivalries[key]||10)+rand(2,6),0,100)}}
  if(m.id==='alliance'){const partner=pick(all.filter(x=>x.id!==a.id&&x.party&&x.party!==a.party));if(partner){ns.coalitions.unshift({month:S.month,a:a.id,b:partner.id,status:'Görüşme başladı',goal});ns.coalitions=ns.coalitions.slice(0,12)}}
  const item={month:S.month,title:`NPC hamlesi: ${a.name}`,text:`${a.name}${a.party?' ('+party(a.party).short+')':''}, “${goal}” hedefi doğrultusunda ${m.label}. Bu hamle sonraki ilişkilerini ve parti dengelerini etkileyebilir.`,type:'actor',actorId:a.id,action:m.id};S.news.unshift(item);S.history.unshift(item);
 });
 // Devam eden kongre yarışı birkaç tur boyunca ilerler; her aşamada tarafların desteği ve ilişkiler önemlidir.

 if(S.character.party&&S.turn>=2&&!S.eventChains.congress&&Math.random()<.18){S.eventChains.congress={title:'Parti içi kongre yarışı',stage:1,status:'Adaylar destek topluyor',started:S.month,pressure:rand(10,25)};log('Olay zinciri başladı: Parti kongresi','Parti içinde olası kongre yarışı konuşuluyor. Adaylar destek topluyor; kararların ve ilişkilerin sonraki aşamaları etkileyebilir.','event')}

 S.news=S.news.slice(0,90);S.history=S.history.slice(0,180);
}
function checkMissions(){if(!S.missions)return;for(const m of S.missions){if(m.done)continue;if(m.id==='first_steps'){m.progress=(S.character.party?1:0)+Math.min(1,S.turn)}if(m.kind==='visibility')m.progress=S.stats.visibility;if(m.kind==='relations')m.progress=Object.values(S.relationships).filter(r=>r.trust>55).length;if(m.progress>=m.target){m.done=true;S.stats.money+=m.reward;log('Görev tamamlandı: '+m.title,`Ödül olarak ${money(m.reward)} kazandın.`,'success')}}}
function showTab(tab){S.tab=tab;render();save()}function render(){if(!S||!S.character){renderStart();return}const nav=[['overview','Genel Bakış','⌂'],['career','Kariyer','↗'],['party','Partiler','⚑'],['people','İlişkiler','♧'],['world','Siyasi Dünya','◎'],['strategy','Kampanya & Kulis','♟'],['civic','Vatandaşlık & Yönetim','🏛'],['economy','Ekonomi','₺'],['election','Seçimler','▥'],['map','Türkiye Haritası','▦'],['parliament','Meclis','▤'],['missions','Görevler','✦'],['journal','Günlük','≡'],['press','Basın / Gazete','▤'],['ai','AI Siyasi Danışman','✦']];$('app').innerHTML=`<div class="wrap"><header class="top"><div class="brand"><div class="sigil">§</div><div><h1>SİYASİ YAŞAM</h1><p>Türkiye siyasi kariyer simülasyonu · ${esc(dateLabel())}</p></div></div><div class="top-actions"><button class="quiet" onclick="save();toast('Oyun kaydedildi.')">Kaydet</button><button class="quiet" onclick="openLoad()">Kayıtlar</button><button class="quiet" onclick="openHelp()">Nasıl oynanır?</button><button class="danger" onclick="openAdminPanel()">🛠 Test / Admin</button></div></header><div class="stats">${statCard('Kamuoyu görünürlüğü',S.stats.visibility+'/100','Görünürlük')}${statCard('Güvenilirlik',S.stats.credibility+'/100','Sözlerin ve tutarlılığın')}${statCard('Örgüt desteği',S.stats.partySupport+'/100','Parti içi destek')}${statCard('Kişisel bütçe',money(S.stats.money),'Gelir / gider')}${statCard('Eylem hakkı',S.actions+'/3',`Enerji ${S.stats.energy}/100`)}</div><div class="layout"><aside class="side"><div class="person" style="padding:7px 5px 13px"><div class="avatar" style="width:44px;height:44px">${esc(initials(S.character.name))}</div><div><strong>${esc(S.character.name)}</strong><small>${esc(S.character.rank)}</small><small>${esc(S.character.party?party(S.character.party).short:'Bağımsız vatandaş')}</small></div></div><nav class="nav">${nav.map(n=>`<button class="${S.tab===n[0]?'active':''}" onclick="showTab('${n[0]}')"><span>${n[2]} &nbsp; ${n[1]}</span>${n[0]==='missions'?`<small>${S.missions.filter(m=>!m.done).length}</small>`:''}</button>`).join('')}</nav><div class="side-foot"><div>📍 ${esc(S.character.origin)}</div><div style="margin-top:4px">🎓 ${esc(S.character.education)}</div><div style="margin-top:4px">🗓️ ${esc(dateLabel())} · ${S.turn}. ay</div><div class="bar"><span style="width:${S.stats.energy}%"></span></div><div>Enerji ${S.stats.energy}% · Stres ${S.stats.stress}%</div></div><button style="width:100%;margin-top:12px" class="primary" onclick="advanceMonth()">Ayı İlerle →</button></aside><main class="main">${renderTab()}</main></div><div class="footer">Siyasi Yaşam · Tek oyunculu simülasyon · Gerçek kişilerle ilgili oyun içi hamleler kurgusal simülasyondur.</div></div>`}
function statCard(label,value,sub){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}function initials(s){return String(s||'?').split(' ').slice(0,2).map(x=>x[0]).join('').toLocaleUpperCase('tr-TR')}
function renderTab(){switch(S.tab){case'world':return renderWorld();case'strategy':return renderStrategy();case'civic':return renderCivic();case'career':return renderCareer();case'party':return renderParty();case'people':return renderPeople();case'economy':return renderEconomy();case'election':return renderElection();case'map':return renderMap();case'parliament':return renderParliament();case'missions':return renderMissions();case'journal':return renderJournal();case'press':return renderPress();case'ai':return renderAI();default:return renderOverview()}}
function monthlyOpportunity(){const e=S.economy,c=S.character;const o=[];if(e.inflation>38)o.push(['Geçim krizi gündemi','Pazar ziyareti ve hayat pahalılığına ilişkin yerel açıklama yap.']);if(e.unemployment>11)o.push(['İşsizlik toplantısı','Yerel esnaf ve iş arayanlarla buluşma fırsatı.']);if(e.mood<38)o.push(['Mahallede protesto çağrısı','Katılman görünürlük kazandırabilir; parti yönetimi tepki gösterebilir.']);if(c.party)o.push(['İlçe teşkilatında kriz','Yönetim senden destek istiyor; taraf seçmen ilişkilerini etkileyebilir.']);else o.push(['Yerel dernekten davet','Sivil toplum çalışmasıyla çevre edinme fırsatı.']);if(S.stats.credibility<35)o.push(['Tartışmalı açıklama gündemde','Yanlış bir çıkış güvenilirliğini daha da düşürebilir.']);if(S.stats.visibility>25)o.push(['Yerel basından röportaj talebi','Hazırlıklı olursan görünürlük kazanabilirsin.']);if(S.turn%4===2)o.push(['Parti kongresi kulisleri','Delegelerle ilişkiler ve olası yönetim değişikliği gündemde.']);return o[(S.turn+Math.floor(S.month/2))%o.length]||['Yerel sorun gündemi','Mahallendeki güncel bir sorun için çözüm arayabilirsin.'];}

function replaceMinister(index){const ps=ensurePresidentState();const m=ps.ministers[index];if(!m)return;const candidates=['Alanında uzman teknokrat','Deneyimli kamu yöneticisi','Partiler arası uzlaşı adayı','Genç reformcu yönetici'];const selected=prompt('Yeni bakan profili seç:\n1. '+candidates[0]+'\n2. '+candidates[1]+'\n3. '+candidates[2]+'\n4. '+candidates[3],'1');if(selected===null)return;const n=Number(selected);if(n<1||n>4)return toast('1 ile 4 arasında seçim yap.');if(!canAct())return toast('Eylem hakkın kalmadı.');spend(1,'minister_'+index);m.name=candidates[n-1];m.performance= n===1?68:n===2?62:n===3?60:58;ps.cabinet=clamp(ps.cabinet+(n===3?3:-1),0,100);ps.history.push({title:'Bakan değişikliği',choice:m.portfolio+' → '+m.name,date:dateLabel()});log('Kabine değişikliği',m.portfolio+' görevine '+m.name+' atandı. İlk performans değerlendirmesi sonraki aylarda yapılacak.','event');save();render();}
function isPresident(){return S?.political?.office==='Cumhurbaşkanı'||S?.character?.rank==='Cumhurbaşkanı'||S?.character?.rank==='Bağımsız Cumhurbaşkanı';}

 const idx=Number(document.querySelector('input[name="presChoice"]:checked')?.value||0);
 const groups={

  economy:[['Enflasyonla mücadele','',{economicConfidence:8,mood:-2,credibility:3,stress:3}],['İstihdam ve üretim paketi','',{economicConfidence:4,mood:4,partySupport:2,money:-25000}],['Sosyal destek programı','',{mood:6,trust:3,economicConfidence:1,money:-40000}]],

  institutions:[['Hukuk ve şeffaflık güvencesi','',{institutionalTrust:9,credibility:4,trust:2}],['Kriz koordinasyon merkezi kur','',{institutionalTrust:6,cabinet:3,stress:-2}],['Performans ve hesap verebilirlik toplantısı','',{institutionalTrust:5,cabinet:5,experience:2}]],
  security:[['Afet hazırlığına kaynak ayır','',{institutionalTrust:4,trust:3,money:-30000}],['Kurumlar arası ortak tatbikat','',{cabinet:5,institutionalTrust:4,stress:-2}],['Şeffaf güvenlik değerlendirmesi','',{credibility:4,trust:2,partySupport:-1}]],
  foreign:[['Komşularla diplomatik temas','',{institutionalTrust:3,economicConfidence:3,credibility:2}],['Ticaret ve yatırım heyeti gönder','',{economicConfidence:5,money:-20000,trust:1}],['Ulusal çıkarlar konusunda sert açıklama','',{partySupport:3,visibility:3,economicConfidence:-2,stress:3}]],
  budget:[['Eğitim ve bilim','',{trust:3,credibility:2,money:-35000,economicConfidence:2}],['Sağlık ve sosyal destek','',{mood:5,trust:3,money:-45000}],['Altyapı ve üretim','',{economicConfidence:5,partySupport:1,money:-40000}]],
  public:[['Gerçekçi hedefler ve takvim açıkla','',{trust:4,credibility:4,stress:-1}],['Birlik ve dayanışma çağrısı yap','',{mood:4,trust:2,visibility:3}],['Büyük ve iddialı vaatlerde bulun','',{visibility:5,partySupport:3,credibility:-3,stress:2}]],
  disaster:[['Önleyici hazırlık planı','',{institutionalTrust:5,trust:3,money:-25000}],['Hızlı müdahale fonu oluştur','',{cabinet:3,trust:2,money:-40000}],['Yerel yönetimlerle ortak masa','',{institutionalTrust:5,parliamentSupport:2,experience:2}]],
  justice:[['Bağımsız denetim mekanizması','',{institutionalTrust:8,credibility:5,partySupport:-1}],['Kamu ihalelerinde açık veri','',{credibility:5,trust:3,economicConfidence:1}],['Reform için geniş istişare','',{parliamentSupport:4,institutionalTrust:4,stress:1}]],
  industry:[['KOBİ üretim desteği','',{economicConfidence:4,mood:3,money:-35000}],['Mesleki eğitim ve genç istihdamı','',{economicConfidence:3,trust:3,money:-25000}],['Ar-Ge ve teknoloji teşviki','',{economicConfidence:5,credibility:2,money:-30000}]],
  diplomacy:[['Bölgesel barış ve iş birliği','',{institutionalTrust:4,credibility:3}],['Enerji ve ticaret anlaşmaları','',{economicConfidence:5,money:-15000}],['İnsan hakları ve eğitim iş birliği','',{credibility:4,trust:2}]]
 };
 const selected=groups[kind]?.[idx];if(!selected){toast('Bir seçenek seçmelisin.');return;}
 if(!isPresident()){closeModal();toast('Cumhurbaşkanlığı yetkin bulunmuyor.');return;}

 const program=presidentialProgramFor(kind,selected[0]);if(program){const ps=ensurePresidentState();const existing=ps.programs.find(p=>p.kind===kind);if(existing){existing.monthsLeft=Math.max(existing.monthsLeft,program.monthsLeft);existing.progress=Math.max(existing.progress,program.progress);existing.choice=selected[0];existing.description=program.description;existing.title=program.title;}else ps.programs.push(program);ps.programs=ps.programs.slice(-12);}
 const label={cabinet:'Kabine kararı',economy:'Ekonomi programı',parliament:'Meclis müzakeresi',institutions:'Kurumlarla eşgüdüm',security:'Güvenlik ve afet koordinasyonu',foreign:'Dış politika hamlesi',budget:'Bütçe öncelikleri',public:'Ulusa sesleniş',disaster:'Afet yönetimi',justice:'Hukuk ve şeffaflık reformu',industry:'Sanayi ve istihdam',diplomacy:'Liderler zirvesi'}[kind];

 log(label,`${selected[0]} kararı uygulandı. ${selected[1]||'Kararın etkileri yönetim göstergelerine işlendi.'}`,'event');closeModal();save();render();toast('Karar uygulandı; etkiler göstergelere işlendi.');

function normalizeProvinceName(n){return String(n||'').normalize('NFC').replace(/İ/g,'i').replace(/I/g,'ı').toLocaleLowerCase('tr-TR').replace(/â/g,'a').replace(/î/g,'i').trim()}
function geoProvinceName(f){const p=f.properties||{};return p.il_adi||p.name||p.NAME_1||p.name_tr||p.province||''}
function geometryRings(geom){if(!geom)return[];if(geom.type==='Polygon')return geom.coordinates||[];if(geom.type==='MultiPolygon')return (geom.coordinates||[]).flat(1);return[]}
function buildProvinceMapSVG(provinces,mayors,major){
 if(!provinceGeoJSON)return '';
 const feats=provinceGeoJSON.features;
 const all=[];feats.forEach(f=>geometryRings(f.geometry).forEach(r=>r.forEach(pt=>all.push(pt))));
 if(!all.length)return '';
 const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
 const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const W=900,H=520,pad=18,scale=Math.min((W-2*pad)/(maxX-minX),(H-2*pad)/(maxY-minY));
 const ox=(W-(maxX-minX)*scale)/2,oy=(H-(maxY-minY)*scale)/2;
 const project=pt=>[ox+(pt[0]-minX)*scale,H-(oy+(pt[1]-minY)*scale)];
 const nameLookup={};provinces.forEach(n=>nameLookup[normalizeProvinceName(n)]=n);
 const paths=feats.map(f=>{
  const rawName=geoProvinceName(f),province=nameLookup[normalizeProvinceName(rawName)]||provinces.find(n=>normalizeProvinceName(n)===normalizeProvinceName(rawName));
  if(!province)return '';
  const mayor=mayors[province],partyName=mapMode==='mayors'?(mayor?.party||'Bilinmiyor'):(major[province]?.[0]||'Bilinmiyor');
  const d=geometryRings(f.geometry).map(r=>r.map((pt,i)=>{const [x,y]=project(pt);return `${i?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`}).join(' ')+' Z').join(' ');
  const isSelected=province===mapProvince;
  const title=mapMode==='mayors'?`${province} — ${mayor?.mayor||'Kayıt yok'} (${partyName})`:`${province} — ${partyName}${major[province]?` (${major[province][1]} MV)`:''}`;
  return `<path d="${d}" fill="${mapMode==='mayors'&&mayor?.color?mayor.color:partyColor(partyName)}" stroke="${isSelected?'#ffffff':'#10192a'}" stroke-width="${isSelected?2.8:1.15}" stroke-linejoin="round" class="province-shape ${isSelected?'selected':''}" tabindex="0" role="button" aria-label="${esc(title)}" onclick="selectProvince('${esc(province).replace(/'/g,"\\'")}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectProvince('${esc(province).replace(/'/g,"\\'")}')}" data-province="${esc(province)}"><title>${esc(title)}</title></path>`;
 }).join('');
 return `<div class="real-map-wrap"><svg class="real-province-map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Türkiye'nin 81 ili siyasi haritası">${paths}</svg></div>`;
}

function buildParliamentSeats(){
 const rows=[];for(let n=16;n<=50;n+=2)rows.push(n);rows[rows.length-1]=48;
 const pts=[],cx=700,baseY=665,inner=190,outer=615;
 rows.forEach((count,ri)=>{const r=inner+(outer-inner)*(ri/(rows.length-1));const start=198*Math.PI/180,end=342*Math.PI/180;
  for(let j=0;j<count;j++){const a=start+(end-start)*(count===1?.5:j/(count-1));pts.push({x:cx+r*Math.cos(a),y:baseY+r*Math.sin(a),angle:a,r,row:ri});}
 });
 // 592 seats; party blocks follow the left-to-right seating arc.
 pts.sort((a,b)=>a.angle-b.angle||b.r-a.r);
 let idx=0;const out=[];
 PARLIAMENT_PARTIES.forEach(p=>{for(let j=0;j<p.count;j++){const pt=pts[idx];if(!pt)continue;out.push({...pt,seatNo:idx+1,party:p.name,color:p.color,partySeat:j+1});idx++;}});
 return out;
}

function parliamentPartyMatch(raw,target){const p=String(raw||'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i');const t=String(target||'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i');if(t==='ak parti')return p==='ak parti';if(t==='yeni yol')return p.includes('yeni yol');if(t==='yrp')return p.includes('yeniden refah')||p==='yrp';if(t==='bağımsız')return p.includes('bagimsiz');if(t==='dem parti')return p==='dem'||p==='dem parti'||p==='halklarin esitlik ve demokrasi partisi';if(t==='tip')return p==='tip'||p.includes('turkiye isci');if(t==='dbp')return p==='dbp'||p.includes('demokratik bolgeler');if(t==='emep')return p==='emep'||p.includes('emek partisi');if(t==='hüda par')return p==='huda par'||p==='hüda par';if(t==='yrp')return p==='yrp';return p===t;}
function parliamentTab(v){ensureParliamentState();S.parliament.view=v;save();render()}
function parliamentPartyMembers(partyName){return NATIONAL_DATA.mps.filter(m=>parliamentPartyMatch(m.party,partyName));}
function parliamentOfficePrompt(key,label){ensureParliamentState();const current=S.parliament.officers[key]||'';openModal(label,`<p class="muted">Bu makamın adını gir. Resmî isim listesi oyuna tam aktarılınca milletvekili listesinden seçme alanı kullanılacak.</p><div class="field"><label>İsim</label><input id="officeName" value="${esc(current.includes('seçilmedi')?'':current)}" placeholder="Milletvekilinin adı"></div>`,`<button onclick="closeModal()">Vazgeç</button><button class="primary" onclick="saveParliamentOffice('${key}')">Kaydet</button>`)}
function saveParliamentOffice(key){if(!canDirectParliament()){toast('Bu makamı belirleme yetkin yok. Kariyerinde ilerlemelisin.');return}const v=document.getElementById('officeName')?.value?.trim();if(!v){toast('Bir isim gir.');return}ensureParliamentState();S.parliament.officers[key]=v;log('Meclis görevlendirmesi',`${key==='speaker'?'TBMM Başkanı':'TBMM Başkanvekili'} olarak ${v} kaydedildi.`);save();closeModal();render()}
function parliamentGroupPrompt(partyName,key,label){ensureParliamentState();if(!S.parliament.groups[partyName])S.parliament.groups[partyName]={chair:'',deputies:[]};const g=S.parliament.groups[partyName];openModal(`${partyName} · ${label}`,`<p class="muted">Grup görevlisini kaydet. Aynı parti grubunda farklı isimler kullanabilirsin.</p><div class="field"><label>Milletvekili adı</label><input id="groupOfficerName" placeholder="Milletvekilinin adı"></div>`,`<button onclick="closeModal()">Vazgeç</button><button class="primary" onclick="saveParliamentGroupOfficer('${partyName}','${key}')">Kaydet</button>`)}
function saveParliamentGroupOfficer(partyName,key){if(!canDirectParliament()){toast('Diğer parti gruplarını sen yönetemezsin.');return}const v=document.getElementById('groupOfficerName')?.value?.trim();if(!v){toast('Bir isim gir.');return}ensureParliamentState();if(!S.parliament.groups[partyName])S.parliament.groups[partyName]={chair:'',deputies:[]};if(key==='chair')S.parliament.groups[partyName].chair=v;else{S.parliament.groups[partyName].deputies=S.parliament.groups[partyName].deputies||[];if(!S.parliament.groups[partyName].deputies.includes(v))S.parliament.groups[partyName].deputies.push(v)}log('Parti grubu',`${partyName} grubunda ${key==='chair'?'grup başkanı':'grup başkanvekili'} olarak ${v} kaydedildi.`);save();closeModal();render()}
function submitParliamentMotion(kind){if(!canDirectParliament()){toast('Meclis teklifi veya önergesi sunmak için milletvekili ya da yetkili görevde olmalısın. Şimdilik kariyer eylemlerini kullan.');return}ensureParliamentState();if(S.actions<1){toast('Bu ay eylem hakkın kalmadı.');return}const title=document.getElementById('motionTitle')?.value?.trim();const body=document.getElementById('motionBody')?.value?.trim();const target=document.getElementById('motionTarget')?.value||'Genel';if(!title||!body){toast('Başlık ve açıklamayı doldur.');return}spend();const m={id:'M'+(S.parliament.motions.length+1),kind,title,body,target,author:S.character.name,party:S.character.party?party(S.character.party).short:'Bağımsız',date:dateLabel(),status:kind==='Kanun teklifi'?'Komisyona sevk bekliyor':kind==='Araştırma önergesi'?'Genel Kurul gündemine alınacak':'İlgili makama iletildi',support:rand(25,70),result:null};S.parliament.motions.unshift(m);log('Meclis işlemi',`${kind} hazırlandı: ${title}.`);save();render();toast(`${kind} kaydedildi.`)}
function openMotionForm(kind){ensureParliamentState();openModal(kind,`<div class="field"><label>Başlık</label><input id="motionTitle" maxlength="120" placeholder="Önerinin kısa başlığı"></div><div class="field" style="margin-top:10px"><label>Konu / gerekçe</label><textarea id="motionBody" maxlength="1200" placeholder="Sorunu, gerekçeyi ve talep edilen işlemi açıkla."></textarea></div><div class="field" style="margin-top:10px"><label>İlgili alan</label><select id="motionTarget"><option>Ekonomi</option><option>Eğitim</option><option>Sağlık</option><option>Adalet</option><option>İçişleri</option><option>Çevre</option><option>Ulaştırma</option><option>Tarım</option><option>Genel</option></select></div><p class="tiny muted" style="margin-top:10px">Bu oyun içi yasama simülasyonudur; gerçek TBMM sistemine gönderim yapmaz.</p>`,`<button onclick="closeModal()">İptal</button><button class="primary" onclick="submitParliamentMotion('${kind}')">Hazırla · 1 eylem</button>`)}
function voteParliamentMotion(id){if(!canDirectParliament()){toast('Genel Kurul oylamasını yönetme yetkin yok. Sonucu gündemden takip edebilirsin.');return}ensureParliamentState();const m=S.parliament.motions.find(x=>x.id===id);if(!m||m.result){toast('Bu öneri zaten sonuçlanmış.');return}if(S.actions<1){toast('Bu ay eylem hakkın kalmadı.');return}spend();const support=clamp(Math.round(m.support+rand(-18,18)+(S.character.party?8:0)),5,95);m.result=support>=50?'Kabul edildi':'Reddedildi';m.support=support;m.status=m.result;S.parliament.votes.unshift({title:m.title,result:m.result,support,date:dateLabel()});if(m.kind==='Kanun teklifi'&&m.result==='Kabul edildi')S.stats.credibility=clamp(S.stats.credibility+3,0,100);log('Genel Kurul oylaması',`${m.title}: ${m.result}. Simüle destek %${support}.`);save();render()}
function assignCommitteeChair(i){ensureParliamentState();const c=S.parliament.committees[i];if(!c)return;const current=c.chair==='Seçilmedi'?'':c.chair;openModal(`${c.name} başkanı`, `<p>Komisyon başkanının adını gir.</p><div class="field"><label>Başkan</label><input id="committeeChairName" value="${esc(current)}" placeholder="Milletvekili adı"></div>`,`<button onclick="closeModal()">İptal</button><button class="primary" onclick="saveCommitteeChair(${i})">Kaydet</button>`)}

function electionCalendar(){
 const m=Number(S.month)||0;
 const nextGeneral=m<60?60:60*(Math.floor((m-60)/60)+2);
 const nextLocal=m<72?72:72+60*Math.floor((m-72)/60)+60;
 const generalMonth=m>=60&&(m-60)%60===0;
 const localMonth=m>=72&&(m-72)%60===0;
 return {localIn:localMonth?0:Math.max(0,nextLocal-m),generalIn:generalMonth?0:Math.max(0,nextGeneral-m),localMonth,generalMonth,nextGeneral,nextLocal};
}

function startBlackjack(amount){if(!S){closeModal();return}if(S.stats.money<amount){toast('Bu bahis için yeterli paran yok.');return}S.betting=S.betting||{count:0,totalWagered:0,totalLost:0,streak:0,lastMonth:-1,pressHeat:0};S.stats.money-=amount;S.betting.count++;S.betting.totalWagered+=amount;S.betting.lastMonth=S.month;S.betting.pressHeat=clamp(S.betting.pressHeat+4,0,100);const draw=()=>{const n=rand(1,13);return n>10?10:n===1?11:n};S.casino=S.casino||{};S.casino.blackjack={amount,player:[draw(),draw()],dealer:[draw(),draw()],done:false};if(S.casino.blackjack.player.reduce((a,b)=>a+b,0)===22)S.casino.blackjack.player[0]=1;renderBlackjack();save()}
function bjTotal(cards){let t=cards.reduce((a,b)=>a+b,0),aces=cards.filter(x=>x===11).length;while(t>21&&aces-->0)t-=10;return t}
function renderBlackjack(message=''){const g=S.casino.blackjack;if(!g)return;const p=bjTotal(g.player),d=bjTotal(g.dealer);openModal('Blackjack',`<p class="muted">Kartlar oyun için rastgele dağıtılır. 21'i geçmeden krupiyeden yüksek toplam yapmaya çalış.</p><div class="grid2"><div class="panel"><h3>Senin elin</h3><div class="big-number">${g.player.join(' · ')}</div><p>Toplam: <b>${p}</b></p></div><div class="panel"><h3>Krupiye</h3><div class="big-number">${g.done?g.dealer.join(' · '):g.dealer[0]+' · 🂠'}</div><p>Toplam: <b>${g.done?d:g.dealer[0]+' + kapalı kart'}</b></p></div></div><div class="notice">Bahis: ${money(g.amount)} · ${message||'Kart çekebilir veya durabilirsin.'}</div>`,g.done?`<button class="primary" onclick="closeModal();save();render()">Masadan kalk</button>`:`<button class="quiet" onclick="blackjackHit()">Kart çek</button><button class="primary" onclick="blackjackStand()">Dur</button>`)}
function blackjackHit(){const g=S?.casino?.blackjack;if(!g||g.done)return;let n=rand(1,13);n=n>10?10:n===1?11:n;g.player.push(n);if(bjTotal(g.player)>21)finishBlackjack('bust');else renderBlackjack('Kart çektin. Karar ver.');save()}
function blackjackStand(){const g=S?.casino?.blackjack;if(!g||g.done)return;while(bjTotal(g.dealer)<17){let n=rand(1,13);g.dealer.push(n>10?10:n===1?11:n)}const p=bjTotal(g.player),d=bjTotal(g.dealer);finishBlackjack(p>d||d>21?'win':p===d?'push':'lose')}
function finishBlackjack(result){const g=S.casino.blackjack;g.done=true;const p=bjTotal(g.player),d=bjTotal(g.dealer);let msg='';if(result==='win'){const payout=g.amount*2;S.stats.money+=payout;S.betting.streak=Math.max(0,S.betting.streak)+1;msg=`Kazandın: ${money(payout)} geri aldın.`;log('Blackjack kazancı',`Blackjack elini ${p} puanla kazandın; ${money(g.amount)} bahis için ${money(payout)} ödeme aldın.`,'warning')}else if(result==='push'){S.stats.money+=g.amount;msg='Berabere: bahis iade edildi.';log('Blackjack beraberlik','El berabere bitti; bahis iade edildi.')}else{S.betting.totalLost+=g.amount;S.betting.streak=Math.min(0,S.betting.streak)-1;S.stats.stress=clamp(S.stats.stress+5,0,100);msg=`Kaybettin: sen ${p}, krupiye ${d}.`;log('Blackjack kaybı',`Blackjack elini kaybettin (${p} - ${d}); ${money(g.amount)} kayıp yazıldı.`,'warning')}
 if(isNewsworthyBetting()&&S.betting.pressHeat>=45&&Math.random()<.18){S.stats.credibility=clamp(S.stats.credibility-2,0,100);S.stats.trust=clamp(S.stats.trust-2,0,100);log('Bahis harcamaları hakkında soru','Kamuoyunda tanınan bir siyasi aktörün bahis harcamaları hakkında gazeteciler soru sormaya başladı. Harcamalar tek başına suç kanıtı değildir; haberin kapsamı ve doğrulanmış belgeler belirleyicidir.','scandal');}renderBlackjack(msg);save()}
function startDiceGame(amount){if(!S){closeModal();return}if(S.stats.money<amount){toast('Bu bahis için yeterli paran yok.');return}S.betting=S.betting||{count:0,totalWagered:0,totalLost:0,streak:0,lastMonth:-1,pressHeat:0};S.stats.money-=amount;S.betting.count++;S.betting.totalWagered+=amount;S.betting.pressHeat=clamp(S.betting.pressHeat+4,0,100);const you=rand(1,6)+rand(1,6),house=rand(1,6)+rand(1,6);let msg;if(you>house){S.stats.money+=amount*2;msg=`Kazandın! Sen ${you}, kasa ${house}. Ödeme: ${money(amount*2)}.`;log('Zar oyunu kazancı',msg,'warning')}else if(you===house){S.stats.money+=amount;msg=`Berabere: sen ${you}, kasa ${house}. Bahis iade edildi.`;log('Zar oyunu beraberlik',msg)}else{S.betting.totalLost+=amount;S.stats.stress=clamp(S.stats.stress+3,0,100);msg=`Kaybettin. Sen ${you}, kasa ${house}. ${money(amount)} kayıp.`;log('Zar oyunu kaybı',msg,'warning')}if(isNewsworthyBetting()&&S.betting.pressHeat>=45&&Math.random()<.18){S.betting.pressHeat=clamp(S.betting.pressHeat+6,0,100);log('Bahis harcamaları hakkında soru','Kamuoyunda tanınan bir siyasi aktörün bahis harcamaları yerel basında gündeme geldi. Bu, tek başına usulsüzlük kanıtı değildir.','media')}closeModal();save();render();openModal('Zar oyunu sonucu',`<p>${esc(msg)}</p>`,`<button class="primary" onclick="closeModal()">Tamam</button>`)}

async function aiQuick(q){const el=document.getElementById('aiPrompt');if(el)el.value=q;await askAI({preventDefault(){}})}
async function askAI(e){
 if(e&&e.preventDefault)e.preventDefault();
 const el=document.getElementById('aiPrompt');const question=(el?.value||'').trim();if(!question)return;
 if(!S.aiChat)S.aiChat=[];S.aiChat.push({role:'user',text:question});save();S.tab='ai';render();
 let answer='',mode='local';
 const payload={question,state:{month:dateLabel(),character:S.character,stats:S.stats,economy:S.economy,party:S.character.party?party(S.character.party).short:'Bağımsız',recent:(S.news||[]).slice(0,8).map(n=>({title:n.title,text:n.text,type:n.type})),relationships:Object.entries(S.relationships||{}).slice(0,8).map(([id,r])=>({id,trust:r.trust,respect:r.respect}))}};
 if(location.protocol==='http:'||location.protocol==='https:'){
  try{
   const response=await fetch('/api/advisor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const data=await response.json().catch(()=>({}));
   if(response.ok&&data.answer){answer=data.answer;mode='api';}
   else {answer=`Gerçek yapay zekâdan yanıt alınamadı. Sunucu yanıtı: ${data.error||('HTTP '+response.status)}. API anahtarını, model erişimini ve API kullanım/bakiye limitini kontrol et. Sunucuyu kapatıp yeniden başlattıktan sonra tekrar dene.`;mode='error';}
  }catch(err){answer='Yapay zekâ sunucusuna ulaşılamadı. CMD penceresinde npm start çalışan sunucunun açık olduğundan emin ol.';mode='error';}
 } else {answer=localAIReply(question);mode='local';}
 S.aiChat.push({role:'assistant',text:answer,mode});S.aiChat=S.aiChat.slice(-24);save();render();
}
function clearAIChat(){S.aiChat=[];save();render();}
function ensurePoliticalSystems(){if(!S.politicalSystems)S.politicalSystems={relationships:{},promises:[],betrayals:[],baseTension:25,youthTension:25,headquartersTrust:55,campaigns:[]};const p=S.politicalSystems;p.relationships=p.relationships||{};p.promises=p.promises||[];p.betrayals=p.betrayals||[];p.campaigns=p.campaigns||[];if(!S.campaignFund)S.campaignFund={balance:45000,donations:0,donorPressure:0,records:[]};S.actors.forEach(a=>{if(!p.relationships[a.id])p.relationships[a.id]={loyalty:45,secretAgenda:'Kendi çevresini büyütmek'}});return p;}
function renderStrategy(){const p=ensurePoliticalSystems(),f=S.campaignFund;return `<section class="hero"><div class="eyebrow">KAMPANYA · KULİS · ÖRGÜT</div><h2>Siyasi güç yalnızca görünürlükten ibaret değil.</h2><p>NPC sadakati ve hırsı, bölgesel kampanya mesajları, bağışçı baskısı ve teşkilat içi gerilimler birlikte işler. Gerçek kişilerle ilgili oyun içi hamleler kurgusal simülasyondur.</p></section><div class="stats"><div class="stat"><div class="label">Kampanya kasası</div><div class="value">${money(f.balance)}</div></div><div class="stat"><div class="label">Bağış toplamı</div><div class="value">${money(f.donations)}</div></div><div class="stat"><div class="label">Genel merkez güveni</div><div class="value">${p.headquartersTrust}/100</div></div><div class="stat"><div class="label">Taban gerilimi</div><div class="value">${p.baseTension}/100</div></div><div class="stat"><div class="label">Gençlik gerilimi</div><div class="value">${p.youthTension}/100</div></div></div><div class="grid2"><section class="panel"><h2>Bölgesel miting</h2><div class="formgrid"><div class="field"><label>İl</label><select id="campaignRegion">${[S.character.locality||S.character.origin,'Konya','İstanbul','Ankara','İzmir','Antalya','Adana','Trabzon','Gaziantep','Erzurum','Şanlıurfa','Kocaeli'].filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Mesaj</label><select id="campaignTopic"><option value="economy">Ekonomi / hayat pahalılığı</option><option value="agriculture">Tarım / üretici</option><option value="industry">Sanayi / istihdam</option><option value="tourism">Turizm</option><option value="security">Güvenlik / kamu hizmeti</option><option value="infrastructure">Ulaşım / altyapı</option></select></div></div><button class="primary" style="margin-top:12px" onclick="runRegionalCampaign()" ${S.actions<=0?'disabled':''}>Miting düzenle · 2.500 ₺ / 1 eylem</button></section><section class="panel"><h2>Bağış ve finansman</h2><p class="muted">Koşullu bağışlar ileride politika beklentisi ve basın riski yaratabilir.</p><div class="wraprow"><button onclick="seekDonation('local')" ${S.actions<=0?'disabled':''}>Yerel bağış topla</button><button onclick="seekDonation('business')" ${S.actions<=0?'disabled':''}>İş insanıyla görüş</button><button onclick="seekDonation('union')" ${S.actions<=0?'disabled':''}>Sendikayla görüş</button></div><div class="list" style="margin-top:10px">${(f.records||[]).slice(-4).reverse().map(x=>`<div class="list-row"><span>${esc(x.source)}${x.conditional?' · koşullu':''}</span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">Henüz bağış yok.</div>'}</div></section></div><div class="grid2"><section class="panel"><h2>Gizli görüşmeler</h2><p class="muted">Aktörün hırsı, sadakati ve seninle ilişkisi teklifin sonucunu etkiler.</p><div class="list">${S.actors.slice(0,12).map(a=>{const r=p.relationships[a.id];return `<div class="list-row"><div><strong>${esc(a.name)}</strong><small>Sadakat ${Math.round(r.loyalty)}/100 · Hırs ${a.ambition||50}/100</small><small>Ajanda: ${esc(r.secretAgenda)}</small></div><button onclick="secretTalk('${a.id}')" ${S.actions<=0?'disabled':''}>Teklif</button></div>`}).join('')}</div></section><section class="panel"><h2>Teşkilat içi gerilim</h2>${meter('Genel merkez güveni',p.headquartersTrust,100,'','good')}${meter('Taban gerilimi',p.baseTension,100,'','warn')}${meter('Gençlik kolları gerilimi',p.youthTension,100,'','bad')}<div class="wraprow"><button onclick="partyTensionAction('center')" ${S.actions<=0?'disabled':''}>Genel merkezle uzlaş</button><button onclick="partyTensionAction('youth')" ${S.actions<=0?'disabled':''}>Gençlik kollarıyla buluş</button></div></section></div><section class="panel"><h2>Verilen sözler / sadakat kırılmaları</h2>${p.promises.slice(-6).reverse().map(x=>`<div class="list-row"><div><strong>${esc(x.title)}</strong><small>${esc(x.detail)}</small></div><span class="pill ${x.risk>55?'bad':'warn'}">Risk ${x.risk}</span></div>`).join('')||'<div class="empty">Henüz kayıt yok.</div>'}${p.betrayals.slice(-4).reverse().map(x=>`<div class="feed-item"><h4>${esc(x.name)} · ${esc(monthLabel(x.month))}</h4><p>${esc(x.text)}</p></div>`).join('')}</section>`;}
function runRegionalCampaign(){if(!canAct())return;const p=ensurePoliticalSystems(),f=S.campaignFund,region=$('campaignRegion').value,topic=$('campaignTopic').value;if(f.balance<2500){toast('Kampanya kasasında yeterli para yok.');return}spend(1,'regionalCampaign');f.balance-=2500;const prof={Konya:{agriculture:1.35,economy:1.2,infrastructure:1.1},İstanbul:{industry:1.3,economy:1.3,infrastructure:1.2},Ankara:{security:1.15,economy:1.15},İzmir:{tourism:1.2,infrastructure:1.1},Antalya:{tourism:1.4},Adana:{agriculture:1.2,industry:1.1},Gaziantep:{industry:1.3},Şanlıurfa:{agriculture:1.4},Kocaeli:{industry:1.4}};const mult=(prof[region]||{economy:1.1,infrastructure:1.05})[topic]||.82,ok=Math.random()<clamp(.35+S.stats.credibility/250+S.stats.visibility/350+(mult-1)*.3,.15,.85),gain=Math.round((ok?rand(3,6):rand(0,2))*mult);S.regionalInfluence=S.regionalInfluence||{};S.regionalInfluence[region]=clamp((S.regionalInfluence[region]||4)+gain,0,100);p.campaigns.unshift({month:S.month,region,topic,gain});if(region===(S.character.locality||S.character.origin))S.stats.partySupport=clamp(S.stats.partySupport+Math.max(0,Math.round(gain/3)),0,100);log('Bölgesel miting',`${region} bölgesinde ${topic} mesajıyla miting yaptın. ${ok?'Mesaj bölgenin gündemiyle örtüştü':'Mesaj sınırlı karşılık buldu'}. Bölgesel nüfuz +${gain}.`,ok?'success':'event');save();render();}
function seekDonation(kind){if(!canAct())return;spend(1,'donation');const f=S.campaignFund,p=ensurePoliticalSystems(),cfg={local:{source:'Yerel bağışçılar',min:800,max:3500,prob:.82,conditional:false},business:{source:'Yerel iş insanı',min:5000,max:18000,prob:.58,conditional:true},union:{source:'Sendika / meslek örgütü',min:2500,max:9000,prob:.66,conditional:Math.random()<.25}}[kind],ok=Math.random()<cfg.prob;if(ok){const amount=rand(cfg.min,cfg.max);f.balance+=amount;f.donations+=amount;f.records.push({source:cfg.source,amount,conditional:cfg.conditional});if(cfg.conditional){f.donorPressure=clamp(f.donorPressure+12,0,100);p.promises.unshift({title:cfg.source+' bağışı',detail:'Bağışçı gelecekte politika desteği bekliyor; kabul etmek zorunlu değil ama baskı yaratabilir.',risk:60});log('Koşullu bağış',`${cfg.source} ${money(amount)} bağış yaptı; politika beklentisi ve itibar riski doğdu.`,'warning')}else log('Kampanya bağışı',`${cfg.source} kampanya kasasına ${money(amount)} bağış yaptı.`,'success')}else log('Bağış görüşmesi',`${cfg.source} bu ay bağış yapmadı.`,'event');save();render();}
function secretTalk(id){if(!canAct())return;const a=S.actors.find(x=>x.id===id);if(!a)return;const p=ensurePoliticalSystems(),r=p.relationships[id],rel=S.relationships[id]||{trust:40};spend(1,'secretTalk');const cost=500;if(S.stats.money<cost){toast('Görüşme için en az 500 ₺ gerekiyor.');S.actions++;return}S.stats.money-=cost;const chance=clamp(.25+(rel.trust||40)/220+(r.loyalty||45)/250-(a.ambition||50)/300+(a.style==='Uzlaşmacı'?.12:0),.08,.8),ok=Math.random()<chance;if(ok){r.loyalty=clamp(r.loyalty+rand(4,9),0,100);rel.trust=clamp((rel.trust||40)+4,0,100);p.promises.unshift({title:a.name+' ile siyasi destek sözü',detail:'Karşılıklı destek beklentisi oluştu; sözler tutulmazsa sadakat düşebilir.',risk:rand(25,60)});log('Gizli kulis',a.name+' ile destek konusunda geçici mutabakat sağlandı. Bu oyun içi varsayımsal bir görüşmedir.','success')}else{r.loyalty=clamp(r.loyalty-rand(4,10),0,100);rel.trust=clamp((rel.trust||40)-3,0,100);S.press.pressHeat=clamp((S.press.pressHeat||0)+rand(3,8),0,100);log('Kulis teklifi reddedildi',a.name+' teklifini kabul etmedi; ilişki ve gizlilik riski oluştu.','warning')}save();render();}
function partyTensionAction(side){if(!canAct())return;const p=ensurePoliticalSystems();spend(1,'partyTension');const ok=Math.random()<.58;if(side==='center'){p.headquartersTrust=clamp(p.headquartersTrust+(ok?8:-4),0,100);p.baseTension=clamp(p.baseTension+(ok?-7:5),0,100)}else{p.youthTension=clamp(p.youthTension+(ok?-8:6),0,100);p.baseTension=clamp(p.baseTension+(ok?-4:3),0,100)}if(ok)S.stats.partySupport=clamp(S.stats.partySupport+2,0,100);log(side==='center'?'Genel merkez görüşmesi':'Gençlik kolları toplantısı',ok?'Ortak bir çalışma zemini bulundu.':'Taraflar arasında görüş ayrılığı derinleşti.',ok?'success':'warning');save();render();}
function simulateLoyaltyAndTensions(){const p=ensurePoliticalSystems();S.actors.forEach(a=>{const r=p.relationships[a.id],rel=S.relationships[a.id]||{trust:40};const loyalty=r.loyalty||45,amb=a.ambition||50,opportunity=(S.stats.partySupport<18?12:0)+(S.stats.visibility<15?7:0);if(S.turn>1&&Math.random()<clamp((amb-loyalty+opportunity)/280,.01,.2)){const other=S.actors.find(x=>x.id!==a.id&&x.party&&x.party!==a.party&&x.ambition>=amb-10);if(other&&a.party){const old=a.party;a.party=other.party;r.loyalty=clamp(loyalty-15,0,100);rel.trust=clamp((rel.trust||40)-7,0,100);p.betrayals.unshift({month:S.month,name:a.name,text:`${party(old).short} çevresinden uzaklaşıp ${party(other.party).short} ile yakınlaşmaya başladı. Kurgusal oyun hamlesidir.`});p.betrayals=p.betrayals.slice(0,10);log('Siyasi saf değişimi',`${a.name} sadakatinin düşmesi ve fırsat arayışı nedeniyle başka bir partiyle yakınlaştı. Bu yalnızca oyun içi simülasyondur.`,'warning')}}else r.loyalty=clamp(loyalty+rand(-2,3),0,100);if(a.style==='Sert'&&S.economy.mood<35)r.secretAgenda='Krizde sert muhalefet ve açık rest';else if(a.style==='Uzlaşmacı'&&S.economy.mood<35)r.secretAgenda='Ortak açıklama ve tansiyonu düşürme';else if(a.style==='Stratejik'&&S.turn>3)r.secretAgenda='Güç dengelerini ölçüp doğru zamanı beklemek';});p.baseTension=clamp(p.baseTension+(S.stats.partySupport<15?2:-1)+rand(-2,2),0,100);p.youthTension=clamp(p.youthTension+(S.stats.visibility<15?1:0)+rand(-2,2),0,100);}

function joinCivicOrg(name){if(!canAct())return;const c=civicState();if(c.organizations.some(o=>o.name===name)){toast('Bu örgüte zaten katıldın.');return}spend(1,'joinOrg');const cost=name.includes('Baro')?700:250;if(S.stats.money<cost){toast(`Katılım için ${money(cost)} gerekiyor.`);return}S.stats.money-=cost;c.organizations.push({id:'org'+Date.now(),name,influence:rand(10,22),board:false,city:S.character.locality||S.character.origin});c.socialCapital=clamp(c.socialCapital+rand(3,7),0,100);S.stats.experience=clamp(S.stats.experience+1,0,100);log('Sivil toplum ağı',`${name} içinde gönüllü çalışmaya başladın. Yerel ağın genişledi.`);save();render()}
function civicOrgWork(id){if(!canAct())return;const c=civicState(),o=c.organizations.find(x=>x.id===id);if(!o)return;spend(1,'orgWork');o.influence=clamp(o.influence+rand(4,9),0,100);c.socialCapital=clamp(c.socialCapital+rand(2,5),0,100);if(o.influence>45&&!o.board&&Math.random()<.3){o.board=true;S.stats.visibility=clamp(S.stats.visibility+2,0,100);log('Örgüt içinde yükseliş',`${o.name} içinde yönetim kurulu sorumluluğu üstlenmen teklif edildi.`)}else log('Sivil çalışma',`${o.name} içinde yerel bir çalışmaya katıldın.`);save();render()}
function collectLocalData(){if(!canAct())return;spend(1,'localData');const c=civicState(),title=$('issueType')?.value||'Yerel sorun dosyası',cost=350;if(S.stats.money<cost){toast(`Veri toplamak için ${money(cost)} gerekiyor.`);return}S.stats.money-=cost;const f={id:'issue'+Date.now(),title,city:S.character.locality||S.character.origin,data:rand(35,75),submitted:false,published:'Taslak',month:S.month};c.issueFiles.push(f);c.socialCapital=clamp(c.socialCapital+2,0,100);log('Yerel veri çalışması',`${f.city} için “${title}” başlıklı dosya oluşturuldu. Veriler sınırlı; sonuçları doğrulamak için daha fazla saha çalışması gerekebilir.`);save();render()}
function publishIssueFile(where){const c=civicState(),f=c.issueFiles.find(x=>!x.submitted);if(!f){toast('Önce bir sorun dosyası oluştur.');return}if(!canAct())return;spend(1,'publishIssue');f.submitted=true;f.published=where==='party'?'Partiye sunuldu':'Basına açıklandı';if(where==='party'){S.stats.partySupport=clamp(S.stats.partySupport+Math.round(f.data/25),0,100);S.stats.experience=clamp(S.stats.experience+2,0,100);log('Yerel sorun dosyası partiye sunuldu',`${f.title} için önerilerin değerlendirilmeye alındı.`)}else{S.stats.visibility=clamp(S.stats.visibility+Math.round(f.data/12),0,100);S.press=S.press||{};S.press.pressHeat=clamp((S.press.pressHeat||0)+Math.round(f.data/15),0,100);log('Yerel dosya basına açıklandı',`${f.title} kamuoyunda gündem oldu; kurumların yanıtı ve dosyanın doğruluğu takip edilecek.`,'event')}save();render()}
function lifeBalance(kind){if(!canAct())return;spend(1,'lifeBalance');if(!S.life)S.life={health:80,family:50,workSatisfaction:60};if(kind==='family'){S.life.family=clamp(S.life.family+rand(8,14),0,100);S.stats.stress=clamp(S.stats.stress-rand(4,8),0,100);S.stats.visibility=clamp(S.stats.visibility-1,0,100);log('Aileye zaman ayırma','Yakınlarınla zaman geçirdin. Siyasi görünürlüğün kısa süreli yavaşladı ama aile bağların güçlendi.')}else{S.life.workSatisfaction=clamp(S.life.workSatisfaction+rand(5,10),0,100);S.stats.experience=clamp(S.stats.experience+1,0,100);log('Mesleki gelişim','Mesleki eğitim veya iş ağına zaman ayırdın.');}save();render()}
function delegateRound(){if(!canAct())return;spend(1,'delegateRound');const c=civicState(),k=pick(['youth','reform','traditional','local']),demands={youth:'daha görünür muhalefet ve genç adaylara alan',reform:'tüzük şeffaflığı ve iç demokrasi',traditional:'parti çizgisinde tutarlılık',local:'yerel teşkilatlara daha fazla kaynak'};const choice=confirm(`${k==='youth'?'Gençlik kanadı':k==='reform'?'Reformcular':k==='traditional'?'Geleneksel kanat':'Yerel teşkilat'} talebi: ${demands[k]}. Kabul edip uzlaşma sözü vermek ister misin?`);if(choice){c.delegates[k]=clamp(c.delegates[k]+rand(8,15),0,100);S.stats.partySupport=clamp(S.stats.partySupport+1,0,100);c.contributions.push({month:S.month,group:k,promise:demands[k]});log('Delege turu',`${demands[k]} konusunda söz verdin. İleride bu vaadin hatırlatılabilir.`)}else{c.delegates[k]=clamp(c.delegates[k]-rand(3,8),0,100);log('Delege turu',`Delege talebini kabul etmedin. ${demands[k]} beklentisi sürüyor.`,'event')}save();render()}
function defendDiscipline(){if(!canAct())return;spend(1,'disciplineDefense');const c=civicState(),risk=(c.discipline.strikes||0)*12+(S.stats.credibility<35?18:0);if(Math.random()<clamp(.72-risk/100,.15,.85)){c.discipline.status='Uyarı ile kapandı';S.stats.credibility=clamp(S.stats.credibility+2,0,100);log('Disiplin kurulu', 'Savunman dikkate alındı. Dosya uyarı ile kapandı.')}else{c.discipline.strikes=(c.discipline.strikes||0)+1;c.discipline.status=c.discipline.strikes>=3?'Geçici uzaklaştırma':c.discipline.strikes===2?'Kınama':'Yazılı uyarı';S.stats.partySupport=clamp(S.stats.partySupport-3,0,100);log('Disiplin kurulu',`Savunman kabul görmedi. Karar: ${c.discipline.status}.`,'warning')}save();render()}
function publicBudgetDecision(){if(!canAct())return;const c=civicState(),roles=[S.political?.office,S.character?.rank].filter(Boolean).join(' ').toLowerCase();if(!/belediye başkanı|belediye|başkan|bakan|cumhurbaşkanı|vali|yönetici/.test(roles)){toast('Bölge bütçesini kullanmak için belediye başkanı veya yetkili bir yönetim makamında olmalısın.');return}const id=$('publicProject')?.value||'social',p={social:['Sosyal yardım ve emekli desteği',40000,'retirees'],park:['Park ve kütüphane',55000,'youth'],infrastructure:['Ulaşım ve altyapı',80000,'residents'],business:['Esnaf desteği',45000,'business'] }[id];if(c.regionalBudget<p[1]){toast('Bölge bütçesinde yeterli kaynak yok.');return}spend(1,'publicBudget');c.regionalBudget-=p[1];c.projects.push({title:p[0],cost:p[1],month:S.month});if(id==='social')S.stats.trust=clamp(S.stats.trust+4,0,100);if(id==='park')S.stats.partySupport=clamp(S.stats.partySupport+3,0,100);if(id==='infrastructure')S.stats.trust=clamp(S.stats.trust+2,0,100);if(id==='business')S.stats.partySupport=clamp(S.stats.partySupport+3,0,100);log('Bölge bütçesi kararı',`${p[0]} için ${money(p[1])} ayrıldı. Bu yatırımın seçmen gruplarına etkisi sonraki aylarda da izlenecek.`);save();render()}
function recordSupporter(source){if(!canAct())return;spend(1,'supporter');const c=civicState(),amount=source==='bağışçı'?rand(4000,12000):rand(500,2500);S.stats.money+=amount;c.debtsToSupporters.push({source,amount,status:'Açık destek borcu',demand:source==='bağışçı'?'Gelecekte karar süreçlerinde erişim bekliyor':'Adaylık veya teşkilat görevi desteği bekliyor',month:S.month});c.socialCapital=clamp(c.socialCapital+2,0,100);log('Siyasi destek alındı',`${source} tarafından ${money(amount)} kaynak ve destek sağlandı. Bu destek ileride talep doğurabilir.`,'event');save();render()}
function settlePoliticalDebt(){if(!canAct())return;const c=civicState(),d=c.debtsToSupporters.find(x=>x.status==='Açık destek borcu');if(!d){toast('Yanıtlanacak açık destek borcu yok.');return}spend(1,'settleDebt');const accept=confirm(`${d.source} talebi: ${d.demand}. Bu talebi kabul etmek ister misin? Kabul etmek itibar riski doğurabilir.`);if(accept){d.status='Talep kabul edildi';S.stats.trust=clamp(S.stats.trust-2,0,100);log('Siyasi diyet',`${d.source} talebini kabul ettin. Bağımsız karar alma alanın daralabilir.`,'warning')}else{d.status='Talep reddedildi';S.stats.credibility=clamp(S.stats.credibility+1,0,100);if(Math.random()<.3)log('Destekçiyle gerilim',`${d.source} talebi reddedildiği için siyasi desteğini geri çekmeye hazırlanıyor.`,'event');}save();render()}
function launchPerceptionCampaign(){if(!canAct())return;const c=civicState();if(S.stats.money<1200){toast('Bu eylem için 1.200 ₺ gerekiyor.');return}spend(1,'perception');S.stats.money-=1200;const ok=Math.random()<.45+S.stats.visibility/300;if(ok){c.disinformation=clamp(c.disinformation+rand(5,12),0,100);S.stats.visibility=clamp(S.stats.visibility+2,0,100);S.stats.credibility=clamp(S.stats.credibility-2,0,100);log('Algı kampanyası', 'Rakip hakkındaki doğrulanmamış iddiaları yaymaya çalıştın. Kısa süreli görünürlük artışı oldu; itibar ve hukuki risk doğdu.','warning')}else{c.disinformation=clamp(c.disinformation+rand(8,16),0,100);S.stats.credibility=clamp(S.stats.credibility-4,0,100);log('Algı kampanyası ters tepti','Kampanyanın koordineli olduğu iddiası gündeme geldi; itibar kaybı ve doğrulama baskısı arttı.','scandal')}save();render()}

function divertAgenda(){if(!canAct())return;if(S.stats.stress<35){toast('Gündem değiştirme girişimi için stresin en az 35 olmalı.');return}spend(1,'divert');const c=civicState();c.agendaDiversions++;S.stats.stress=clamp(S.stats.stress-1,0,100);if(Math.random()<.5){S.press=S.press||{};S.press.pressHeat=clamp((S.press.pressHeat||0)-rand(4,10),0,100);S.stats.credibility=clamp(S.stats.credibility-rand(2,5),0,100);log('Gündem saptırma', 'Başka bir konu gündeme taşındı; olumsuz haber ilgisi azaldı ama bu hamle fark edilirse güvenilirlik kaybı yaratabilir.','warning')}else{S.press=S.press||{};S.press.pressHeat=clamp((S.press.pressHeat||0)+rand(5,12),0,100);S.stats.stress=clamp(S.stats.stress+5,0,100);log('Gündem saptırma başarısız','Basın bağlantıyı sorguladı; gündem kontrolü girişimi yeni eleştirilere yol açtı.','scandal')}save();render()}

function pressResponse(){if(!canAct())return;spend(1,'press_response');const heat=S.betting?.pressHeat||0;const success=Math.random()<(.45+S.stats.credibility/200);if(success){S.stats.credibility=clamp(S.stats.credibility+2,0,100);S.stats.trust=clamp(S.stats.trust+(heat>25?2:1),0,100);if(S.betting)S.betting.pressHeat=clamp(S.betting.pressHeat-12,0,100);log('Basın açıklaması','Belgeler üzerinden yanıt verdin ve soruları açık biçimde yanıtlamaya çalıştın. Basın ilgisi bir miktar azaldı.','media')}else{S.stats.trust=clamp(S.stats.trust-3,0,100);S.stats.credibility=clamp(S.stats.credibility-2,0,100);if(S.betting)S.betting.pressHeat=clamp(S.betting.pressHeat+8,0,100);log('Basın açıklaması ters tepti','Yanıtların bazı soruları karşılamadı. Gazeteciler ek belge ve açıklama istedi.','scandal')}save();render()}

function ensureElectionPolitics(){
 if(!S.electionPolitics)S.electionPolitics={declaredCandidates:{AKP:'Hakan Fidan',YENI:'Ekrem İmamoğlu',ZAFER:'Ümit Özdağ'},alliances:[],campaigns:{},negotiations:[],history:[]};
 const ep=S.electionPolitics;ep.declaredCandidates=ep.declaredCandidates||{AKP:'Hakan Fidan',YENI:'Ekrem İmamoğlu',ZAFER:'Ümit Özdağ'};ep.alliances=ep.alliances||[];ep.campaigns=ep.campaigns||{};ep.negotiations=ep.negotiations||[];ep.history=ep.history||[];
 ep.alliances.forEach(a=>{if(a.trust==null)a.trust=60;if(a.stability==null)a.stability=60;if(a.platform==null)a.platform='Ekonomi ve sosyal refah';if(a.terms==null)a.terms='Ortak program ve düzenli koordinasyon';if(a.monthsTogether==null)a.monthsTogether=0;if(a.broken==null)a.broken=false});

function partyNameForElection(id){return (S.parties.find(p=>p.id===id)?.short)||party(id).short||id;}
function declarePresidentialCandidate(){
 const ep=ensureElectionPolitics();
 const options=S.parties.filter(p=>p.id!=='OTHER'&&p.id===S.character.party&&!ep.declaredCandidates[p.id]&&!ep.alliances.some(a=>a.parties.includes(p.id))).map(p=>`<option value="${p.id}">${esc(p.short)}</option>`).join('');
 if(!options){toast('Aday belirleyebilecek boşta parti kalmadı.');return}
 const body=`<p class="muted">Her parti cumhurbaşkanı adayı çıkarmak zorunda değil. Aday belirlemek, oyunda o partinin yarışa katılacağı anlamına gelir.</p><div class="field"><label>Parti</label><select id="declareCandidateParty">${options}</select></div><div class="field"><label>Adayın adı</label><input id="declareCandidateName" maxlength="70" placeholder="Adayın adı" required></div><p class="tiny muted">Adayı ilan etmek 1 eylem hakkı ve 1.000 ₺ kampanya hazırlığı gerektirir.</p>`;

function confirmDeclareCandidate(){
 const ep=ensureElectionPolitics(),id=$('declareCandidateParty')?.value,name=($('declareCandidateName')?.value||'').trim();
 if(!id||name.length<3){toast('Parti ve geçerli aday adı seç.');return}if(!S.character.party||id!==S.character.party){toast('Yalnızca üyesi olduğun parti adına aday ilan edebilirsin. Önce kendi partine katılmalısın.');return}if(name!==S.character.name){toast('Bu işlemde yalnızca kendi karakterini aday ilan edebilirsin. NPC adaylarını oyun kendi belirler.');return}
 if(!canAct()){closeModal();toast('Eylem hakkın kalmadı.');return}
 if(S.stats.money<1000){toast('Adaylık hazırlığı için 1.000 ₺ gerekiyor.');return}
 if(ep.declaredCandidates[id]||ep.alliances.some(a=>a.parties.includes(id))){toast('Bu parti zaten bir aday veya ittifak içinde.');return}
 spend(1,'declarePresCandidate');S.stats.money-=1000;ep.declaredCandidates[id]=name;ep.campaigns[id]=ep.campaigns[id]||{momentum:0,organization:10,debate:0,pledges:[],fatigue:0};ep.history.unshift({month:S.month,type:'candidate',text:`${name}, ${partyNameForElection(id)} adına aday ilan edildi.`});
 log('Cumhurbaşkanı adayı ilan edildi',`${partyNameForElection(id)} adına ${name} aday olarak ilan edildi. Bu oyun içi senaryo kararıdır.`,'event');closeModal();save();render();
}
function proposeElectionAlliance(){
 const ep=ensureElectionPolitics();
 const available=S.parties.filter(p=>p.id!=='OTHER'&&!ep.alliances.some(a=>a.parties.includes(p.id)));
